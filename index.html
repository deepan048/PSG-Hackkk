    // =========================================================
    // GLOBAL THEME SETTINGS PANEL
    // =========================================================
    function ThemePanel({ theme, setTheme, onClose }) {
      const [localTheme, setLocalTheme] = useState({ ...theme });
      const [savedThemes, setSavedThemes] = useState(() => {
        try { return JSON.parse(localStorage.getItem('vds_themes') || '[]'); } catch { return []; }
      });
      const [themeName, setThemeName] = useState('');

      const up = (key, val) => setLocalTheme(t => ({ ...t, [key]: val }));

      const applyTheme = () => {
        setTheme(localTheme);
        onClose();
      };

      const saveTheme = () => {
        const name = themeName.trim() || `Theme ${savedThemes.length + 1}`;
        const updated = [...savedThemes, { name, ...localTheme }];
        setSavedThemes(updated);
        localStorage.setItem('vds_themes', JSON.stringify(updated));
        setThemeName('');
      };

      const loadSavedTheme = (t) => {
        const { name, ...colors } = t;
        setLocalTheme(colors);
      };

      const deleteSavedTheme = (idx) => {
        const updated = savedThemes.filter((_, i) => i !== idx);
        setSavedThemes(updated);
        localStorage.setItem('vds_themes', JSON.stringify(updated));
      };

      const ThemeColorRow = ({ label, themeKey }) => (
        <div style={{ marginBottom: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
          <label style={{ fontSize: 12, color: '#9ca3af', width: 110, flexShrink: 0 }}>{label}</label>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flex: 1, background: '#374151', borderRadius: 6, padding: '4px 8px', border: '1px solid #4b5563' }}>
            <input
              type="color"
              value={localTheme[themeKey] || '#000000'}
              onChange={e => up(themeKey, e.target.value)}
              style={{ width: 28, height: 28, flexShrink: 0 }}
            />
            <input
              className="prop-input"
              value={localTheme[themeKey] || ''}
              onChange={e => up(themeKey, e.target.value)}
              style={{ flex: 1, border: 'none', background: 'transparent', padding: '0 2px' }}
            />
          </div>
          <div style={{ width: 28, height: 28, background: localTheme[themeKey], borderRadius: 6, border: '2px solid #4b5563', flexShrink: 0 }} />
        </div>
      );

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" style={{ width: 440, maxHeight: '90vh' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <span style={{ fontSize: 18 }}>🎨</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: '#f9fafb' }}>Global Design Settings</div>
                <div style={{ fontSize: 12, color: '#6b7280', marginTop: 2 }}>Theme colors and fonts applied to new templates.</div>
              </div>
              <button className="modal-close" onClick={onClose} title="Close">
                <Icon name="X" size={18} />
              </button>
            </div>
            <div style={{ flex: 1, overflowY: 'auto', padding: 20 }}>
              {/* Colors */}
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#6b7280', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 12 }}>Colors</div>
                <ThemeColorRow label="Primary Color"    themeKey="primaryColor" />
                <ThemeColorRow label="Secondary Color"  themeKey="secondaryColor" />
                <ThemeColorRow label="Background"       themeKey="bgColor" />
                <ThemeColorRow label="Text Color"       themeKey="textColor" />
              </div>

              {/* Live preview swatch row */}
              <div style={{ marginBottom: 16, padding: 12, background: '#111827', borderRadius: 8, border: '1px solid #374151' }}>
                <div style={{ fontSize: 11, color: '#6b7280', marginBottom: 10 }}>PREVIEW</div>
                <div style={{ background: localTheme.bgColor, borderRadius: 8, padding: 16 }}>
                  <div style={{ fontSize: 20, fontWeight: 700, color: localTheme.textColor, fontFamily: localTheme.fontFamily, marginBottom: 6 }}>Sample Heading</div>
                  <div style={{ fontSize: 13, color: localTheme.textColor, opacity: 0.7, fontFamily: localTheme.fontFamily, marginBottom: 12 }}>This is a sample paragraph with the selected theme colors and font applied.</div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <div style={{ background: localTheme.primaryColor, color: '#fff', padding: '6px 16px', borderRadius: 6, fontSize: 12, fontWeight: 600, fontFamily: localTheme.fontFamily }}>Primary</div>
                    <div style={{ background: localTheme.secondaryColor, color: '#fff', padding: '6px 16px', borderRadius: 6, fontSize: 12, fontWeight: 600, fontFamily: localTheme.fontFamily }}>Secondary</div>
                  </div>
                </div>
              </div>

              {/* Font */}
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#6b7280', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 10 }}>Global Font</div>
                <select
                  className="prop-input"
                  value={localTheme.fontFamily}
                  onChange={e => up('fontFamily', e.target.value)}
                  style={{ background: '#374151', color: '#e5e7eb' }}
                >
                  {FONT_OPTIONS.map(f => (
                    <option key={f.value} value={f.value} style={{ fontFamily: f.value }}>{f.label}</option>
                  ))}
                </select>
                <div style={{ marginTop: 8, padding: '8px 12px', background: '#374151', borderRadius: 6, fontSize: 15, color: '#f9fafb', fontFamily: localTheme.fontFamily }}>
                  The quick brown fox jumps over the lazy dog.
                </div>
              </div>

              {/* Reset to default */}
              <div style={{ marginBottom: 20 }}>
                <button
                  onClick={() => setLocalTheme({ ...DEFAULT_THEME })}
                  style={{ background: 'none', border: '1px solid #4b5563', borderRadius: 6, color: '#9ca3af', cursor: 'pointer', padding: '6px 14px', fontSize: 12 }}
                >
                  ↺ Reset to Default
                </button>
              </div>

              {/* Save / Load themes */}
              <div style={{ borderTop: '1px solid #374151', paddingTop: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#6b7280', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 10 }}>Saved Themes</div>
                <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
                  <input
                    className="prop-input"
                    value={themeName}
                    onChange={e => setThemeName(e.target.value)}
                    placeholder="Theme name…"
                    style={{ flex: 1 }}
                  />
                  <button
                    onClick={saveTheme}
                    style={{ background: '#374151', border: '1px solid #4b5563', borderRadius: 6, color: '#d1d5db', cursor: 'pointer', padding: '4px 12px', fontSize: 12, whiteSpace: 'nowrap' }}
                  >
                    Save Current
                  </button>
                </div>
                {savedThemes.length === 0 ? (
                  <div style={{ fontSize: 12, color: '#6b7280', textAlign: 'center', padding: '12px 0' }}>No saved themes yet.</div>
                ) : (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                    {savedThemes.map((t, i) => (
                      <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                        <button className="saved-theme-btn" onClick={() => loadSavedTheme(t)}>
                          {t.name}
                        </button>
                        <div style={{ display: 'flex', gap: 2 }}>
                          {['primaryColor','secondaryColor','bgColor','textColor'].map(k => (
                            <div key={k} style={{ width: 10, height: 10, background: t[k], borderRadius: 2, border: '1px solid #4b5563' }} />
                          ))}
                        </div>
                        <button onClick={() => deleteSavedTheme(i)} style={{ background: 'none', border: 'none', color: '#6b7280', cursor: 'pointer', padding: 2, fontSize: 11 }} title="Remove">✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* Footer actions */}
            <div style={{ padding: '12px 20px', borderTop: '1px solid #374151', background: '#111827', display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button onClick={onClose} style={{ background: 'none', border: '1px solid #374151', borderRadius: 6, color: '#9ca3af', cursor: 'pointer', padding: '8px 20px', fontSize: 13 }}>
                Cancel
              </button>
              <button onClick={applyTheme} style={{ background: '#3b82f6', border: 'none', borderRadius: 6, color: '#fff', cursor: 'pointer', padding: '8px 24px', fontSize: 13, fontWeight: 600 }}>
                Apply Theme
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // CONTEXT  (now includes clipboard)
    // =========================================================
    const StudioContext = createContext(null);
    const useStudio = () => useContext(StudioContext);

    // =========================================================
    // COMPONENT RENDERER
    // =========================================================
    function renderComponentContent(comp, preview, navContext = {}) {
      const { type, props: p, style: s } = comp;
      const { activePageId, onNavigatePage } = navContext;

      // --- Shared style properties that apply to ALL element types ---
      // NOTE: overflow is intentionally omitted from baseStyle for text types
      // so that multi-line text is never clipped. It is added back only for
      // non-text types (image, container, section) where clipping is correct.
      const sharedStyle = {
        opacity: s.opacity,
        backgroundColor: s.backgroundColor || undefined,
        borderWidth: s.borderWidth ? `${s.borderWidth}px` : undefined,
        borderStyle: s.borderWidth ? 'solid' : undefined,
        borderColor: s.borderColor,
        borderRadius: s.borderRadius ? `${s.borderRadius}px` : undefined,
        boxShadow: s.boxShadow ? `0 0 ${s.shadowBlur}px ${s.shadowSpread}px ${s.shadowColor}` : undefined,
        marginTop: s.marginTop || undefined,
        marginRight: s.marginRight || undefined,
        marginBottom: s.marginBottom || undefined,
        marginLeft: s.marginLeft || undefined,
        paddingTop: s.paddingTop || undefined,
        paddingRight: s.paddingRight || undefined,
        paddingBottom: s.paddingBottom || undefined,
        paddingLeft: s.paddingLeft || undefined,
      };

      // For block/structural elements (image, container, section, card, divider, input)
      // we keep overflow:hidden and honour the stored dimensions.
      const blockStyle = {
        ...sharedStyle,
        width: comp.width === 'auto' ? 'auto' : `${comp.width}px`,
        height: comp.height === 'auto' ? 'auto' : `${comp.height}px`,
        overflow: 'hidden',
      };

      // For TEXT elements (heading, paragraph, text) we:
      //  • Always use height:'auto' so the element grows with its content.
      //  • Apply width from stored value (controls line-wrap point).
      //  • Never set overflow:hidden — that clips wrapped lines.
      //  • Add word-wrap so long words don't spill horizontally.
      const textStyle = {
        ...sharedStyle,
        width: comp.width === 'auto' ? 'auto' : `${comp.width}px`,
        height: 'auto',          // ← always auto — text must never be clipped
        overflow: 'visible',     // ← explicit: do not clip wrapped text
        overflowWrap: 'break-word',
        wordWrap: 'break-word',
        wordBreak: 'break-word',
        whiteSpace: 'pre-wrap',  // preserves intentional line breaks, wraps naturally
      };

      switch (type) {
        case 'heading':
          return (
            <h1 style={{
              ...textStyle,
              fontSize: p.fontSize,
              fontWeight: p.fontWeight,
              color: p.color,
              textAlign: p.textAlign,
              lineHeight: p.lineHeight || 1.25,   // sensible default; avoids tight clipping at large sizes
              margin: 0,
              padding: '4px 4px',
              display: 'block',
            }}>
              {p.text}
            </h1>
          );

        case 'paragraph':
          return (
            <p style={{
              ...textStyle,
              fontSize: p.fontSize,
              fontWeight: p.fontWeight,
              color: p.color,
              lineHeight: p.lineHeight || 1.6,
              textAlign: p.textAlign,
              margin: 0,
              padding: '4px 4px',
              display: 'block',
            }}>
              {p.text}
            </p>
          );

        case 'text':
          return (
            <span style={{
              ...textStyle,
              fontSize: p.fontSize,
              fontWeight: p.fontWeight,
              color: p.color,
              textAlign: p.textAlign,
              lineHeight: p.lineHeight || 1.5,
              display: 'block',  // block so width constraint works and text wraps
              padding: '4px 4px',
            }}>
              {p.text}
            </span>
          );

        case 'button':
          return (
            <button
              style={{
                ...blockStyle,
                backgroundColor: p.bgColor,
                color: p.textColor,
                borderRadius: p.borderRadius,
                paddingLeft: p.paddingX,
                paddingRight: p.paddingX,
                paddingTop: p.paddingY,
                paddingBottom: p.paddingY,
                border: 'none',
                cursor: 'pointer',
                fontWeight: 600,
                fontSize: 14,
                whiteSpace: 'nowrap',
              }}
              onClick={preview ? () => {
                if (p.targetPageId && onNavigatePage) {
                  onNavigatePage(p.targetPageId);
                } else if (p.href) {
                  window.open(p.href, '_blank');
                }
              } : undefined}
            >
              {p.label}
            </button>
          );

        case 'navbar': {
          const links = Array.isArray(p.links) ? p.links : [];
          const justifyMap = {
            'space-between': 'space-between',
            left: 'flex-start',
            center: 'center',
            right: 'flex-end',
          };
          return (
            <nav
              style={{
                ...blockStyle,
                backgroundColor: p.bgColor || '#1e293b',
                color: p.textColor || '#f8fafc',
                display: 'flex',
                alignItems: 'center',
                justifyContent: justifyMap[p.align] || 'space-between',
                paddingLeft: p.paddingX ?? 24,
                paddingRight: p.paddingX ?? 24,
                gap: p.gap ?? 20,
                boxSizing: 'border-box',
              }}
            >
              {p.showBrand !== false && (
                <span style={{ fontWeight: 700, fontSize: (p.fontSize || 14) + 4, color: p.textColor || '#f8fafc', whiteSpace: 'nowrap', marginRight: p.align === 'left' ? 16 : 0 }}>
                  {p.brandText || 'MySite'}
                </span>
              )}
              <div style={{ display: 'flex', alignItems: 'center', gap: p.gap ?? 20, flexWrap: 'wrap' }}>
                {links.map(link => {
                  const isActive = activePageId && link.pageId === activePageId;
                  return (
                    <a
                      key={link.id}
                      href={`#${link.pageId || ''}`}
                      onClick={(e) => {
                        e.preventDefault();
                        if (preview && link.pageId && onNavigatePage) {
                          onNavigatePage(link.pageId);
                        }
                      }}
                      style={{
                        color: isActive ? (p.activeColor || '#3b82f6') : (p.textColor || '#f8fafc'),
                        fontSize: p.fontSize || 14,
                        fontWeight: isActive ? 700 : 500,
                        textDecoration: 'none',
                        cursor: preview ? 'pointer' : 'inherit',
                        whiteSpace: 'nowrap',
                        borderBottom: isActive ? `2px solid ${p.activeColor || '#3b82f6'}` : '2px solid transparent',
                        paddingBottom: 2,
                      }}
                    >
                      {link.label}
                    </a>
                  );
                })}
                {links.length === 0 && !preview && (
                  <span style={{ fontSize: 12, opacity: 0.6 }}>No links — add in Properties</span>
                )}
              </div>
            </nav>
          );
        }

        case 'image':
          if (!p.src) {
            return (
              <div style={{ ...blockStyle, backgroundColor: '#e5e7eb', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 8, borderRadius: p.borderRadius ? `${p.borderRadius}px` : undefined }}>
                <Icon name="Image" size={40} style={{ color: '#9ca3af' }} />
                <span style={{ color: '#9ca3af', fontSize: 12 }}>No image — upload or enter URL</span>
              </div>
            );
          }
          return <img src={p.src} alt={p.alt} style={{ ...blockStyle, objectFit: p.objectFit, display: 'block', borderRadius: p.borderRadius ? `${p.borderRadius}px` : undefined }} />;

        case 'container':
          return (
            <div style={{ ...blockStyle, backgroundColor: p.bgColor || 'transparent', padding: p.padding, borderRadius: p.borderRadius, borderWidth: p.borderWidth, borderStyle: 'dashed', borderColor: preview ? p.borderColor : '#94a3b8', gap: p.gap, display: 'flex', flexWrap: 'wrap', alignContent: 'flex-start', minWidth: 80, minHeight: 60 }}>
              {!preview && <span style={{ color: '#94a3b8', fontSize: 11, alignSelf: 'center', pointerEvents: 'none' }}>Container</span>}
            </div>
          );

        case 'section':
          return (
            <div style={{ ...blockStyle, backgroundColor: p.bgColor, padding: p.padding, borderWidth: p.borderWidth, borderStyle: 'solid', borderColor: p.borderColor, minHeight: 80 }}>
              {!preview && <span style={{ color: '#9ca3af', fontSize: 11 }}>Section</span>}
            </div>
          );

        case 'card': {
          // Cards use height:auto so their internal text never clips
          const cardStyle = { ...blockStyle, height: 'auto', overflow: 'visible' };
          return (
            <div style={{ ...cardStyle, backgroundColor: p.bgColor, borderRadius: p.borderRadius, boxShadow: p.shadow ? '0 10px 25px rgba(0,0,0,0.12)' : 'none', padding: 24 }}>
              <h3 style={{ margin: '0 0 8px', fontSize: 18, fontWeight: 700, color: '#1a1a1a', lineHeight: 1.3, overflowWrap: 'break-word' }}>{p.title}</h3>
              <p style={{ margin: 0, fontSize: 14, color: '#6b7280', lineHeight: 1.5, overflowWrap: 'break-word' }}>{p.body}</p>
            </div>
          );
        }

        case 'input':
          return (
            <div style={{ ...blockStyle, padding: 4 }}>
              {p.labelText && <label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: '#374151', marginBottom: 4 }}>{p.labelText}</label>}
              <input
                type={p.inputType}
                placeholder={p.placeholder}
                readOnly={!preview}
                style={{ width: '100%', padding: '8px 12px', border: `1px solid ${p.borderColor}`, borderRadius: 6, fontSize: 14, color: '#374151', outline: 'none', boxSizing: 'border-box' }}
              />
            </div>
          );

        case 'divider':
          return <hr style={{ ...blockStyle, borderColor: p.color, borderTopWidth: p.thickness, borderStyle: 'solid', borderBottom: 'none', borderLeft: 'none', borderRight: 'none', margin: 0 }} />;

        default:
          return <div style={blockStyle}>{type}</div>;
      }
    }

    // =========================================================
    // COMPONENT WRAPPER (canvas element)
    // =========================================================
    function CanvasComponent({ comp, preview, zoom, activePageIdOverride, onNavigatePage }) {
      const { state, dispatch } = useStudio();
      const { selectedId } = state;
      const effectiveActivePageId = activePageIdOverride || state.activePageId;
      const isSelected = selectedId === comp.id && !preview;
      const isLocked = !!comp.locked;
      const wrapperRef = useRef(null);
      const dragOffset = useRef({ x: 0, y: 0 });
      const isDragging = useRef(false);
      const isResizing = useRef(null);
      const zoomRef = useRef(zoom);
      useEffect(() => { zoomRef.current = zoom; }, [zoom]);

      const handleMouseDown = useCallback((e) => {
        if (preview) return;
        if (e.button !== 0) return;
        e.stopPropagation();
        dispatch({ type: 'SELECT_COMPONENT', payload: comp.id });

        // If locked, just select — no drag
        if (isLocked) return;

        // Use page-element bounding rect for correct zoomed coordinate conversion
        const pageEl = wrapperRef.current?.parentElement;
        if (!pageEl) return;
        const pageRect = pageEl.getBoundingClientRect();
        const scale = zoomRef.current || 1;
        // Convert screen coords to unscaled canvas coords
        dragOffset.current = {
          x: (e.clientX - pageRect.left) / scale - comp.x,
          y: (e.clientY - pageRect.top)  / scale - comp.y,
        };
        isDragging.current = true;

        const onMove = (ev) => {
          if (!isDragging.current) return;
          const s = zoomRef.current || 1;
          const rect = pageEl.getBoundingClientRect();
          const nx = Math.max(0, (ev.clientX - rect.left) / s - dragOffset.current.x);
          const ny = Math.max(0, (ev.clientY - rect.top)  / s - dragOffset.current.y);
          dispatch({ type: 'UPDATE_COMPONENT_FAST', payload: { id: comp.id, updates: { x: nx, y: ny } } });
        };
        const onUp = () => {
          if (isDragging.current) {
            isDragging.current = false;
            dispatch({ type: 'UPDATE_COMPONENT', payload: { id: comp.id, updates: { x: comp.x, y: comp.y } } });
          }
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      }, [comp, preview, isLocked]);

      const handleResizeMouseDown = useCallback((e, handle) => {
        if (preview || isLocked) return;
        e.stopPropagation();
        e.preventDefault();
        isResizing.current = handle;

        const pageEl = wrapperRef.current?.parentElement;
        const pageRect = pageEl ? pageEl.getBoundingClientRect() : { left: 0, top: 0 };
        const scale = zoomRef.current || 1;
        const startX = (e.clientX - pageRect.left) / scale;
        const startY = (e.clientY - pageRect.top)  / scale;
        const startW = comp.width === 'auto' ? wrapperRef.current.offsetWidth : comp.width;
        const startH = comp.height === 'auto' ? wrapperRef.current.offsetHeight : comp.height;
        const startXPos = comp.x;
        const startYPos = comp.y;

        const onMove = (ev) => {
          const s = zoomRef.current || 1;
          const rect = pageEl ? pageEl.getBoundingClientRect() : { left: 0, top: 0 };
          const dx = (ev.clientX - rect.left) / s - startX;
          const dy = (ev.clientY - rect.top)  / s - startY;
          let newW = startW, newH = startH, newX = startXPos, newY = startYPos;

          if (handle.includes('e')) newW = Math.max(40, startW + dx);
          if (handle.includes('w')) { newW = Math.max(40, startW - dx); newX = startXPos + (startW - newW); }
          if (handle.includes('s')) newH = Math.max(20, startH + dy);
          if (handle.includes('n')) { newH = Math.max(20, startH - dy); newY = startYPos + (startH - newH); }

          dispatch({ type: 'UPDATE_COMPONENT_FAST', payload: { id: comp.id, updates: { width: Math.round(newW), height: Math.round(newH), x: Math.round(newX), y: Math.round(newY) } } });
        };
        const onUp = () => {
          isResizing.current = null;
          dispatch({ type: 'UPDATE_COMPONENT', payload: { id: comp.id, updates: { width: comp.width, height: comp.height, x: comp.x, y: comp.y } } });
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      }, [comp, preview, isLocked]);

      if (!comp.visible && !preview) {
        return (
          <div ref={wrapperRef} className="component-wrapper" style={{ position: 'absolute', left: comp.x, top: comp.y, opacity: 0.3, zIndex: comp.zIndex, pointerEvents: 'none', overflow: 'visible' }}>
            {renderComponentContent(comp, preview, { activePageId: effectiveActivePageId, onNavigatePage })}
          </div>
        );
      }
      if (!comp.visible && preview) return null;

      const handles = ['nw','n','ne','e','se','s','sw','w'];
      const handlePos = {
        nw: { top: -5, left: -5, cursor: 'nw-resize' },
        n:  { top: -5, left: 'calc(50% - 5px)', cursor: 'n-resize' },
        ne: { top: -5, right: -5, cursor: 'ne-resize' },
        e:  { top: 'calc(50% - 5px)', right: -5, cursor: 'e-resize' },
        se: { bottom: -5, right: -5, cursor: 'se-resize' },
        s:  { bottom: -5, left: 'calc(50% - 5px)', cursor: 's-resize' },
        sw: { bottom: -5, left: -5, cursor: 'sw-resize' },
        w:  { top: 'calc(50% - 5px)', left: -5, cursor: 'w-resize' },
      };

      // Text-type components must have height:auto on the wrapper too,
      // so the wrapper grows with the content and never clips wrapped lines.
      const TEXT_TYPES = ['heading', 'paragraph', 'text'];
      const isTextType = TEXT_TYPES.includes(comp.type);

      const selectionClass = isSelected
        ? (isLocked ? 'component-locked-selected' : 'component-selected')
        : '';

      return (
        <div
          ref={wrapperRef}
          className={`component-wrapper drop-anim ${selectionClass} ${isLocked ? 'locked' : ''}`}
          style={{
            position: 'absolute',
            left: comp.x,
            top: comp.y,
            zIndex: comp.zIndex,
            width: comp.width === 'auto' ? 'auto' : comp.width,
            // Text types always auto-height; non-text types use stored height
            height: isTextType ? 'auto' : (comp.height === 'auto' ? 'auto' : comp.height),
            overflow: 'visible',  // wrapper itself must never clip children
          }}
          onMouseDown={handleMouseDown}
        >
          {renderComponentContent(comp, preview, { activePageId: effectiveActivePageId, onNavigatePage })}
          {/* Lock badge indicator */}
          {isSelected && isLocked && (
            <div className="lock-badge">🔒</div>
          )}
          {/* Resize handles — hidden when locked */}
          {isSelected && !isLocked && handles.map(h => (
            <div
              key={h}
              className="resize-handle"
              style={{ ...handlePos[h] }}
              onMouseDown={e => handleResizeMouseDown(e, h)}
            />
          ))}
        </div>
      );
    }

    // =========================================================
    // CANVAS
    // =========================================================
    function Canvas({ zoom, fitMode }) {
      const { state, dispatch } = useStudio();
      const { components, selectedId, previewMode, deviceMode } = state;
      const canvasRef = useRef(null);
      const pageRef = useRef(null);

      const device = DEVICE_PRESETS[deviceMode] || DEVICE_PRESETS.desktop;
      const pageWidth = device.width;
      const pageMinHeight = device.minHeight;

      const handleCanvasClick = useCallback((e) => {
        if (e.target === canvasRef.current || e.target === pageRef.current) {
          dispatch({ type: 'SELECT_COMPONENT', payload: null });
        }
      }, []);

      const handleDragOver = useCallback((e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      }, []);

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        const compType = e.dataTransfer.getData('componentType');
        if (!compType) return;

        const pageRect = pageRef.current.getBoundingClientRect();
        const scale = zoom || 1;
        const x = Math.max(0, (e.clientX - pageRect.left) / scale);
        const y = Math.max(0, (e.clientY - pageRect.top) / scale);

        const def = COMPONENT_TYPES.find(c => c.type === compType);
        const sizes = DEFAULT_SIZES[compType] || { width: 200, height: 'auto' };
        const newComp = {
          id: genId(),
          type: compType,
          label: def ? def.label : compType,
          visible: true,
          locked: false,
          x: Math.round(x),
          y: Math.round(y),
          width: sizes.width,
          height: sizes.height,
          zIndex: (components.length) + 1,
          props: { ...DEFAULT_PROPS[compType] },
          style: { ...DEFAULT_STYLE },
        };
        dispatch({ type: 'ADD_COMPONENT', payload: newComp });
      }, [components, zoom]);

      const effectiveZoom = zoom || 1;
      // CSS transform scale doesn't change layout size — compensate with negative margin
      // to avoid giant empty space below the visually shrunken page canvas.
      const scaledMarginCorrection = effectiveZoom < 1
        ? pageMinHeight * (1 - effectiveZoom)
        : 0;

      return (
        <div
          ref={canvasRef}
          className="canvas-area"
          style={{
            flex: 1,
            overflow: 'auto',
            padding: 40,
            minHeight: 0,
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
          }}
          onClick={handleCanvasClick}
          onDragOver={handleDragOver}
          onDrop={handleDrop}
        >
          {/* Device badge shown above the page */}
          <div style={{ marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
            <div style={{
              background: '#171717',
              border: '1px solid #383838',
              borderRadius: 20,
              padding: '4px 14px',
              fontSize: 11,
              color: '#A3A3A3',
              display: 'flex',
              alignItems: 'center',
              gap: 6,
              userSelect: 'none',
            }}>
              <Icon name={DEVICE_PRESETS[deviceMode]?.icon || 'Monitor'} size={12} style={{ color: '#10A37F' }} />
              <span style={{ fontWeight: 600, color: '#F5F5F5' }}>{DEVICE_PRESETS[deviceMode]?.label}</span>
              <span style={{ color: '#A3A3A3' }}>{DEVICE_PRESETS[deviceMode]?.shortcut}</span>
            </div>
          </div>
          {/* Zoom wrapper — CSS transform scale only, doesn't affect stored positions */}
          <div style={{
            transformOrigin: 'top center',
            transform: `scale(${effectiveZoom})`,
            flexShrink: 0,
            // Compensate layout height so we don't get giant blank space when zoomed out
            marginBottom: effectiveZoom < 1 ? `-${scaledMarginCorrection}px` : 0,
          }}>
            <div
              ref={pageRef}
              className="canvas-page"
              style={{
                position: 'relative',
                width: pageWidth,
                minHeight: pageMinHeight,
                backgroundColor: '#ffffff',
                lineHeight: 'normal',
                boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
                borderRadius: deviceMode === 'mobile' ? 16 : deviceMode === 'tablet' ? 8 : 2,
                flexShrink: 0,
                transition: 'width 0.3s ease, border-radius 0.3s ease',
              }}
            >
              {components.map(comp => (
                <CanvasComponent key={comp.id} comp={comp} preview={previewMode} zoom={effectiveZoom} />
              ))}
              {components.length === 0 && !previewMode && (
                <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%,-50%)', textAlign: 'center', color: '#9ca3af', pointerEvents: 'none' }}>
                  <Icon name="Layout" size={48} style={{ color: '#d1d5db', marginBottom: 16 }} />
                  <p style={{ fontSize: 16, fontWeight: 600, margin: '0 0 8px' }}>Drag components here</p>
                  <p style={{ fontSize: 13, margin: 0 }}>Select from the left panel to start building</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // ADD PAGE MODAL
    // =========================================================
    function AddPageModal({ existingPages, onCreate, onClose }) {
      const [name, setName] = useState('');
      const [slug, setSlug] = useState('');
      const [slugEdited, setSlugEdited] = useState(false);
      const [error, setError] = useState('');

      const handleNameChange = (val) => {
        setName(val);
        setError('');
        if (!slugEdited) {
          setSlug(val ? slugifyPage(val) : '');
        }
      };

      const handleSlugChange = (val) => {
        setSlugEdited(true);
        setSlug(val.toLowerCase().replace(/[^a-z0-9-]/g, '-'));
        setError('');
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const trimmedName = name.trim();
        if (!trimmedName) {
          setError('Please enter a page name.');
          return;
        }
        const finalSlug = slugifyPage(slug || trimmedName);
        if (existingPages.some(p => p.name.toLowerCase() === trimmedName.toLowerCase())) {
          setError(`A page named "${trimmedName}" already exists.`);
          return;
        }
        if (existingPages.some(p => (p.slug || '').toLowerCase() === finalSlug.toLowerCase())) {
          setError(`The URL slug "/${finalSlug}" is already in use.`);
          return;
        }
        onCreate({ name: trimmedName, slug: finalSlug });
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" style={{ width: '90vw', maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <Icon name="FileText" size={18} style={{ color: '#93c5fd' }} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: '#f9fafb' }}>Add New Page</div>
                <div style={{ fontSize: 12, color: '#9ca3af', marginTop: 2 }}>Create a new independent page for your website.</div>
              </div>
              <button className="modal-close" onClick={onClose} title="Cancel">
                <Icon name="X" size={18} />
              </button>
            </div>
            <form onSubmit={handleSubmit} style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 14 }}>
              <div>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 600, color: '#d1d5db', marginBottom: 6 }}>
                  Page Name *
                </label>
                <input
                  type="text"
                  value={name}
                  onChange={e => handleNameChange(e.target.value)}
                  placeholder="e.g. Portfolio, Blog, Pricing"
                  autoFocus
                  style={{
                    width: '100%',
                    padding: '8px 10px',
                    background: '#111827',
                    border: '1px solid #374151',
                    borderRadius: 6,
                    color: '#f9fafb',
                    fontSize: 13,
                    outline: 'none',
                    boxSizing: 'border-box',
                  }}
                />
              </div>
              <div>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 600, color: '#d1d5db', marginBottom: 6 }}>
                  URL Slug *
                </label>
                <div style={{ display: 'flex', alignItems: 'center', background: '#111827', border: '1px solid #374151', borderRadius: 6, overflow: 'hidden' }}>
                  <span style={{ padding: '8px 10px', fontSize: 12, color: '#6b7280', background: '#1f2937', borderRight: '1px solid #374151' }}>/</span>
                  <input
                    type="text"
                    value={slug}
                    onChange={e => handleSlugChange(e.target.value)}
                    placeholder="page-url-slug"
                    style={{
                      flex: 1,
                      padding: '8px 10px',
                      background: 'transparent',
                      border: 'none',
                      color: '#f9fafb',
                      fontSize: 13,
                      outline: 'none',
                      boxSizing: 'border-box',
                    }}
                  />
                </div>
              </div>
              {error && (
                <div style={{ fontSize: 12, color: '#fca5a5', background: 'rgba(239,68,68,0.12)', border: '1px solid rgba(239,68,68,0.4)', borderRadius: 6, padding: '8px 10px' }}>
                  {error}
                </div>
              )}
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 4 }}>
                <button
                  type="button"
                  onClick={onClose}
                  style={{ padding: '8px 14px', background: '#2A2A2A', color: '#F5F5F5', border: '1px solid #383838', borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  style={{ padding: '8px 16px', background: '#10A37F', color: '#fff', border: 'none', borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
                >
                  Create Page
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================
    // PAGES PANEL (Multi-Page Website Manager)
    // =========================================================
    function PagesPanel() {
      const { state, dispatch } = useStudio();
      const { pages, activePageId } = state;
      const [editingId, setEditingId] = useState(null);
      const [editingName, setEditingName] = useState('');
      const [showAddModal, setShowAddModal] = useState(false);
      const dragPageIdx = useRef(null);
      const [dragOverId, setDragOverId] = useState(null);

      const handleCreatePage = ({ name, slug }) => {
        dispatch({ type: 'ADD_PAGE', payload: { name, slug } });
        setShowAddModal(false);
      };

      const startRename = (e, page) => {
        e.stopPropagation();
        setEditingId(page.id);
        setEditingName(page.name);
      };

      const commitRename = () => {
        if (editingId && editingName.trim()) {
          dispatch({ type: 'RENAME_PAGE', payload: { id: editingId, name: editingName.trim() } });
        }
        setEditingId(null);
        setEditingName('');
      };

      const handleDragStart = (e, idx) => {
        dragPageIdx.current = idx;
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragEnter = (idx, id) => {
        if (dragPageIdx.current === null || dragPageIdx.current === idx) return;
        setDragOverId(id);
      };

      const handleDrop = (idx) => {
        if (dragPageIdx.current !== null && dragPageIdx.current !== idx) {
          dispatch({ type: 'REORDER_PAGES', payload: { fromIndex: dragPageIdx.current, toIndex: idx } });
        }
        dragPageIdx.current = null;
        setDragOverId(null);
      };

      return (
        <div style={{ borderTop: '1px solid #383838', flexShrink: 0, display: 'flex', flexDirection: 'column', maxHeight: 210, backgroundColor: '#171717' }}>
          <div style={{ padding: '8px 12px', borderBottom: '1px solid #383838', backgroundColor: '#171717', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: '#A3A3A3', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Pages</span>
              <span style={{ fontSize: 10, background: '#2A2A2A', color: '#F5F5F5', padding: '0 5px', borderRadius: 999 }}>{pages.length}</span>
            </div>
            <button
              onClick={() => setShowAddModal(true)}
              style={{
                display: 'flex',
                alignItems: 'center',
                gap: 4,
                padding: '4px 8px',
                background: '#10A37F',
                color: '#fff',
                border: 'none',
                borderRadius: 5,
                fontSize: 11,
                fontWeight: 600,
                cursor: 'pointer',
              }}
              title="Add a new page"
            >
              <span>+ Add Page</span>
            </button>
          </div>

          <div style={{ overflowY: 'auto', overflowX: 'hidden', overscrollBehavior: 'contain', padding: '4px 0', maxHeight: 165 }}>
            {pages.map((page, idx) => {
              const isActive = page.id === activePageId;
              const isDragOver = dragOverId === page.id;
              return (
                <div
                  key={page.id}
                  draggable={editingId !== page.id}
                  onDragStart={e => handleDragStart(e, idx)}
                  onDragEnter={() => handleDragEnter(idx, page.id)}
                  onDragOver={e => e.preventDefault()}
                  onDragLeave={() => setDragOverId(null)}
                  onDrop={() => handleDrop(idx)}
                  onClick={() => { if (editingId !== page.id) dispatch({ type: 'SWITCH_PAGE', payload: page.id }); }}
                  style={{
                    padding: '7px 10px',
                    display: 'flex',
                    alignItems: 'center',
                    gap: 6,
                    cursor: 'pointer',
                    backgroundColor: isActive ? '#343434' : 'transparent',
                    borderLeft: isActive ? '3px solid #10A37F' : '3px solid transparent',
                    borderTop: isDragOver ? '2px solid #10A37F' : '2px solid transparent',
                    transition: 'background 0.1s',
                  }}
                >
                  <Icon name="GripVertical" size={11} style={{ color: '#A3A3A3', cursor: 'grab', flexShrink: 0 }} />
                  <Icon name={page.isHome ? 'Home' : 'FileText'} size={13} style={{ color: page.isHome ? '#10A37F' : (isActive ? '#F5F5F5' : '#A3A3A3'), flexShrink: 0 }} />

                  {editingId === page.id ? (
                    <input
                      className="layer-rename-input"
                      value={editingName}
                      onChange={e => setEditingName(e.target.value)}
                      onBlur={commitRename}
                      onKeyDown={e => {
                        if (e.key === 'Enter') commitRename();
                        if (e.key === 'Escape') { setEditingId(null); setEditingName(''); }
                      }}
                      onClick={e => e.stopPropagation()}
                      autoFocus
                    />
                  ) : (
                    <div style={{ flex: 1, minWidth: 0, display: 'flex', alignItems: 'center', gap: 5 }} onDoubleClick={e => startRename(e, page)}>
                      <span style={{ fontSize: 12, color: isActive ? '#f9fafb' : '#d1d5db', fontWeight: isActive ? 600 : 400, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {page.name}
                      </span>
                      {page.isHome && (
                        <span style={{ fontSize: 9, background: 'rgba(245,158,11,0.18)', color: '#fbbf24', padding: '1px 4px', borderRadius: 3, fontWeight: 700, flexShrink: 0 }}>
                          HOME
                        </span>
                      )}
                    </div>
                  )}

                  {editingId !== page.id && (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 2, flexShrink: 0 }} onClick={e => e.stopPropagation()}>
                      {!page.isHome && (
                        <button
                          onClick={() => dispatch({ type: 'SET_HOME_PAGE', payload: page.id })}
                          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7280', padding: 2, lineHeight: 1 }}
                          title="Set as Homepage"
                        >
                          <Icon name="Home" size={11} />
                        </button>
                      )}
                      <button
                        onClick={e => startRename(e, page)}
                        style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7280', padding: 2, lineHeight: 1 }}
                        title="Rename page"
                      >
                        <Icon name="Pencil" size={11} />
                      </button>
                      <button
                        onClick={() => dispatch({ type: 'DUPLICATE_PAGE', payload: page.id })}
                        style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7280', padding: 2, lineHeight: 1 }}
                        title="Duplicate page"
                      >
                        <Icon name="Copy" size={11} />
                      </button>
                      {pages.length > 1 && (
                        <button
                          onClick={() => { if (confirm(`Delete page "${page.name}"?`)) dispatch({ type: 'DELETE_PAGE', payload: page.id }); }}
                          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7280', padding: 2, lineHeight: 1 }}
                          title="Delete page"
                        >
                          <Icon name="Trash2" size={11} />
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {showAddModal && (
            <AddPageModal
              existingPages={pages}
              onCreate={handleCreatePage}
              onClose={() => setShowAddModal(false)}
            />
          )}
        </div>
      );
    }

    // =========================================================
    // LEFT PANEL — Component Library + Pages + Layers
    // =========================================================
    function ComponentLibrary() {
      const { state, dispatch } = useStudio();
      const fileInputRef = useRef(null);

      const handleDragStart = (e, type) => {
        e.dataTransfer.setData('componentType', type);
        e.dataTransfer.effectAllowed = 'copy';
      };

      // FEATURE 1: Upload image from computer and add to canvas
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          alert('Please select an image file.');
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const src = ev.target.result; // base64 data URL
          const newComp = {
            id: genId(),
            type: 'image',
            label: file.name || 'Uploaded Image',
            visible: true,
            locked: false,
            x: 60,
            y: 60,
            width: 300,
            height: 200,
            zIndex: state.components.length + 1,
            props: { src, alt: file.name, objectFit: 'cover', borderRadius: 0 },
            style: { ...DEFAULT_STYLE },
          };
          dispatch({ type: 'ADD_COMPONENT', payload: newComp });
        };
        reader.readAsDataURL(file);
        // Reset input so same file can be uploaded again
        e.target.value = '';
      };

      return (
        <div style={{ width: 220, height: '100%', minHeight: 0, flex: 1, flexShrink: 0, backgroundColor: '#171717', borderRight: '1px solid #383838', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          <div style={{ padding: '10px 14px', borderBottom: '1px solid #383838', backgroundColor: '#171717', flexShrink: 0 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: '#A3A3A3', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Components</span>
          </div>

          <div style={{ overflowY: 'auto', overflowX: 'hidden', flex: 1, minHeight: 0, overscrollBehavior: 'contain' }}>
            {/* FEATURE 1: Image Upload Button */}
            <div style={{ padding: '8px 8px 0' }}>
              <button
                className="upload-btn"
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                title="Upload an image from your computer"
              >
                <Icon name="Upload" size={13} />
                Upload Image
              </button>
              <input
                ref={fileInputRef}
                type="file"
                accept="image/*"
                style={{ display: 'none' }}
                onChange={handleImageUpload}
              />
            </div>
            <div style={{ padding: 8, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
              {COMPONENT_TYPES.map(({ type, label, icon }) => (
                <div
                  key={type}
                  className="component-tile"
                  draggable="true"
                  onDragStart={(e) => handleDragStart(e, type)}
                  style={{
                    backgroundColor: '#2A2A2A',
                    borderRadius: 6,
                    padding: '10px 8px',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    gap: 6,
                    border: '1px solid #383838',
                    cursor: 'grab',
                  }}
                >
                  <Icon name={icon} size={18} style={{ color: '#10A37F' }} />
                  <span style={{ fontSize: 11, color: '#F5F5F5', fontWeight: 500, textAlign: 'center' }}>{label}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Pages Panel (always visible) */}
          <PagesPanel />

          {/* Layers Panel (always visible) */}
          <LayersPanel />
        </div>
      );
    }

    // =========================================================
    // LAYERS PANEL — with rename, lock, visibility, drag-drop
    // =========================================================
    function LayersPanel() {
      const { state, dispatch } = useStudio();
      const { components, selectedId } = state;
      const dragItem = useRef(null);
      const dragOver = useRef(null);
      const [editingId, setEditingId] = useState(null);
      const [editingLabel, setEditingLabel] = useState('');
      const [dragOverId, setDragOverId] = useState(null);

      const handleLayerDragStart = (e, index) => {
        dragItem.current = index;
        e.dataTransfer.effectAllowed = 'move';
      };
      const handleLayerDragEnter = (e, index, id) => {
        dragOver.current = index;
        setDragOverId(id);
      };
      const handleLayerDragLeave = () => {
        setDragOverId(null);
      };
      const handleLayerDrop = () => {
        if (dragItem.current === null || dragOver.current === null) return;
        dispatch({ type: 'REORDER_COMPONENT', payload: { fromIndex: dragItem.current, toIndex: dragOver.current } });
        dragItem.current = null;
        dragOver.current = null;
        setDragOverId(null);
      };

      // Start renaming
      const startRename = (e, comp) => {
        e.stopPropagation();
        setEditingId(comp.id);
        setEditingLabel(comp.label);
      };

      // Commit rename
      const commitRename = () => {
        if (editingId && editingLabel.trim()) {
          dispatch({ type: 'RENAME_COMPONENT', payload: { id: editingId, label: editingLabel.trim() } });
        }
        setEditingId(null);
        setEditingLabel('');
      };

      return (
        <div style={{ borderTop: '1px solid #383838', backgroundColor: '#171717' }}>
          <div style={{ padding: '10px 16px', borderBottom: '1px solid #383838' }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: '#A3A3A3', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Layers</span>
          </div>
          <div style={{ maxHeight: 170, overflowY: 'auto' }}>
            {components.length === 0 && (
              <div style={{ padding: '16px', textAlign: 'center', color: '#A3A3A3', fontSize: 12 }}>No layers yet</div>
            )}
            {[...components].reverse().map((comp, ri) => {
              const index = components.length - 1 - ri;
              const def = COMPONENT_TYPES.find(c => c.type === comp.type);
              const isEditing = editingId === comp.id;
              const isDragTarget = dragOverId === comp.id;
              return (
                <div
                  key={comp.id}
                  className={`layer-item ${isDragTarget ? 'layer-drag-over' : ''}`}
                  draggable
                  onDragStart={e => handleLayerDragStart(e, index)}
                  onDragEnter={e => handleLayerDragEnter(e, index, comp.id)}
                  onDragLeave={handleLayerDragLeave}
                  onDragOver={e => e.preventDefault()}
                  onDrop={handleLayerDrop}
                  onClick={() => dispatch({ type: 'SELECT_COMPONENT', payload: comp.id })}
                  style={{
                    padding: '6px 8px',
                    display: 'flex',
                    alignItems: 'center',
                    gap: 5,
                    cursor: 'pointer',
                    backgroundColor: selectedId === comp.id ? '#343434' : 'transparent',
                    borderLeft: selectedId === comp.id ? '2px solid #10A37F' : '2px solid transparent',
                    fontSize: 12,
                    color: '#F5F5F5',
                    opacity: comp.visible ? 1 : 0.5,
                  }}
                >
                  <Icon name="GripVertical" size={11} style={{ color: '#A3A3A3', flexShrink: 0 }} />
                  <Icon name={def?.icon || 'Square'} size={11} style={{ color: '#10A37F', flexShrink: 0 }} />

                  {/* Layer name — double-click to rename */}
                  {isEditing ? (
                    <input
                      className="layer-rename-input"
                      value={editingLabel}
                      autoFocus
                      onChange={e => setEditingLabel(e.target.value)}
                      onBlur={commitRename}
                      onKeyDown={e => {
                        if (e.key === 'Enter') commitRename();
                        if (e.key === 'Escape') { setEditingId(null); setEditingLabel(''); }
                        e.stopPropagation();
                      }}
                      onClick={e => e.stopPropagation()}
                      style={{ flex: 1 }}
                    />
                  ) : (
                    <span
                      style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontSize: 11 }}
                      title="Double-click to rename"
                      onDoubleClick={e => startRename(e, comp)}
                    >{comp.label}</span>
                  )}

                  {/* Action buttons */}
                  <div style={{ display: 'flex', gap: 2, alignItems: 'center', flexShrink: 0 }}>
                    {/* Visibility toggle */}
                    <button
                      onClick={e => { e.stopPropagation(); dispatch({ type: 'TOGGLE_VISIBILITY', payload: comp.id }); }}
                      style={{ background: 'none', border: 'none', cursor: 'pointer', color: comp.visible ? '#10A37F' : '#A3A3A3', padding: 2, lineHeight: 1 }}
                      title={comp.visible ? 'Hide layer' : 'Show layer'}
                    >
                      <Icon name={comp.visible ? 'Eye' : 'EyeOff'} size={11} />
                    </button>
                    {/* Lock toggle */}
                    <button
                      onClick={e => { e.stopPropagation(); dispatch({ type: 'TOGGLE_LOCK', payload: comp.id }); }}
                      style={{ background: 'none', border: 'none', cursor: 'pointer', color: comp.locked ? '#f59e0b' : '#6b7280', padding: 2, lineHeight: 1 }}
                      title={comp.locked ? 'Unlock layer' : 'Lock layer'}
                    >
                      <Icon name={comp.locked ? 'Lock' : 'Unlock'} size={11} />
                    </button>
                    {/* Delete */}
                    <button
                      onClick={e => { e.stopPropagation(); dispatch({ type: 'DELETE_COMPONENT', payload: comp.id }); }}
                      style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7280', padding: 2, lineHeight: 1 }}
                      title="Delete layer"
                    >
                      <Icon name="Trash2" size={11} />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =========================================================
    // PROPERTIES PANEL
    // =========================================================
    function PropInput({ label, value, onChange, type = 'text', min, max, step }) {
      return (
        <div style={{ marginBottom: 8 }}>
          <label style={{ display: 'block', fontSize: 11, color: '#9ca3af', marginBottom: 3 }}>{label}</label>
          <input
            className="prop-input"
            type={type}
            value={value ?? ''}
            min={min}
            max={max}
            step={step}
            onChange={e => onChange(type === 'number' ? (e.target.value === '' ? '' : Number(e.target.value)) : e.target.value)}
          />
        </div>
      );
    }

    function PropRow({ children }) {
      return <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>{children}</div>;
    }

    function PropColorPicker({ label, value, onChange }) {
      return (
        <div style={{ marginBottom: 8, display: 'flex', alignItems: 'center', gap: 8 }}>
          <label style={{ fontSize: 11, color: '#9ca3af', flex: 1 }}>{label}</label>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: '#374151', borderRadius: 4, padding: '2px 6px', border: '1px solid #4b5563' }}>
            <input type="color" value={value || '#000000'} onChange={e => onChange(e.target.value)} style={{ width: 24, height: 24 }} />
            <input
              className="prop-input"
              value={value || ''}
              onChange={e => onChange(e.target.value)}
              style={{ width: 72, border: 'none', background: 'transparent', padding: '0 2px' }}
              placeholder="#000000"
            />
          </div>
        </div>
      );
    }

    function PropSelect({ label, value, onChange, options }) {
      return (
        <div style={{ marginBottom: 8 }}>
          <label style={{ display: 'block', fontSize: 11, color: '#9ca3af', marginBottom: 3 }}>{label}</label>
          <select
            className="prop-input"
            value={value}
            onChange={e => onChange(e.target.value)}
            style={{ background: '#374151', color: '#e5e7eb' }}
          >
            {options.map(o => <option key={o.value || o} value={o.value || o}>{o.label || o}</option>)}
          </select>
        </div>
      );
    }

    function SectionHeader({ title }) {
      return (
        <div style={{ padding: '8px 16px', backgroundColor: '#171717', borderBottom: '1px solid #383838', borderTop: '1px solid #383838', marginBottom: 4 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: '#A3A3A3', textTransform: 'uppercase', letterSpacing: '0.08em' }}>{title}</span>
        </div>
      );
    }

    function SpecificProps({ comp, onUpdate }) {
      const { state } = useStudio();
      const pages = state.pages || [];
      const { type, props: p } = comp;
      const up = (key, val) => onUpdate({ props: { ...p, [key]: val } });
      const fileInputRef = useRef(null);

      switch (type) {
        case 'heading':
        case 'paragraph':
        case 'text':
          return (
            <>
              <div style={{ padding: '0 12px' }}>
                <div style={{ marginBottom: 8 }}>
                  <label style={{ display: 'block', fontSize: 11, color: '#9ca3af', marginBottom: 3 }}>Text Content</label>
                  <textarea
                    className="prop-input"
                    value={p.text}
                    onChange={e => up('text', e.target.value)}
                    rows={3}
                    style={{ resize: 'vertical' }}
                  />
                </div>
                <PropRow>
                  <div style={{ flex: 1 }}><PropInput label="Font Size" type="number" value={p.fontSize} onChange={v => up('fontSize', v)} /></div>
                  <div style={{ flex: 1 }}>
                    <PropSelect label="Weight" value={p.fontWeight} onChange={v => up('fontWeight', v)} options={['normal','500','600','bold','800']} />
                  </div>
                </PropRow>
                <PropColorPicker label="Color" value={p.color} onChange={v => up('color', v)} />
                {/* Line Height exposed for all text types */}
                <PropInput label="Line Height" type="number" step="0.1" value={p.lineHeight ?? (type === 'heading' ? 1.25 : 1.6)} onChange={v => up('lineHeight', v)} />
                <PropSelect label="Text Align" value={p.textAlign} onChange={v => up('textAlign', v)} options={['left','center','right','justify']} />
              </div>
            </>
          );
        case 'button':
          return (
            <div style={{ padding: '0 12px' }}>
              <PropInput label="Button Label" value={p.label} onChange={v => up('label', v)} />
              <PropColorPicker label="Background" value={p.bgColor} onChange={v => up('bgColor', v)} />
              <PropColorPicker label="Text Color" value={p.textColor} onChange={v => up('textColor', v)} />
              <PropInput label="Border Radius" type="number" value={p.borderRadius} onChange={v => up('borderRadius', v)} />
              <PropRow>
                <div style={{ flex: 1 }}><PropInput label="Padding X" type="number" value={p.paddingX} onChange={v => up('paddingX', v)} /></div>
                <div style={{ flex: 1 }}><PropInput label="Padding Y" type="number" value={p.paddingY} onChange={v => up('paddingY', v)} /></div>
              </PropRow>
              <PropInput label="href / URL" value={p.href} onChange={v => up('href', v)} />
              <div style={{ marginBottom: 8 }}>
                <label style={{ display: 'block', fontSize: 11, color: '#9ca3af', marginBottom: 3 }}>Link to Page</label>
                <select
                  className="prop-input"
                  value={p.targetPageId || ''}
                  onChange={e => up('targetPageId', e.target.value)}
                >
                  <option value="">None (use href URL)</option>
                  {pages.map(pg => (
                    <option key={pg.id} value={pg.id}>{pg.name}</option>
                  ))}
                </select>
              </div>
            </div>
          );

        case 'navbar': {
          const links = Array.isArray(p.links) ? p.links : [];
          const updateLinks = (nextLinks) => up('links', nextLinks);
          const addLink = () => {
            const target = pages[0]?.id || '';
            updateLinks([
              ...links,
              { id: 'nl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5), label: 'New Link', pageId: target },
            ]);
          };
          const moveLink = (idx, dir) => {
            const targetIdx = idx + dir;
            if (targetIdx < 0 || targetIdx >= links.length) return;
            const copy = [...links];
            const [item] = copy.splice(idx, 1);
            copy.splice(targetIdx, 0, item);
            updateLinks(copy);
          };
          return (
            <div style={{ padding: '0 12px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                <input type="checkbox" checked={p.showBrand !== false} onChange={e => up('showBrand', e.target.checked)} id="nav-brand-toggle" />
                <label htmlFor="nav-brand-toggle" style={{ fontSize: 12, color: '#d1d5db', cursor: 'pointer' }}>Show Brand Name</label>
              </div>
              {p.showBrand !== false && (
                <PropInput label="Brand Text" value={p.brandText || ''} onChange={v => up('brandText', v)} />
              )}
              <PropColorPicker label="Background" value={p.bgColor || '#1e293b'} onChange={v => up('bgColor', v)} />
              <PropColorPicker label="Link Color" value={p.textColor || '#f8fafc'} onChange={v => up('textColor', v)} />
              <PropColorPicker label="Active Link Color" value={p.activeColor || '#3b82f6'} onChange={v => up('activeColor', v)} />
              <PropRow>
                <div style={{ flex: 1 }}><PropInput label="Font Size" type="number" value={p.fontSize ?? 14} onChange={v => up('fontSize', v)} /></div>
                <div style={{ flex: 1 }}><PropInput label="Link Gap" type="number" value={p.gap ?? 20} onChange={v => up('gap', v)} /></div>
              </PropRow>
              <PropSelect label="Alignment" value={p.align || 'space-between'} onChange={v => up('align', v)} options={['space-between', 'left', 'center', 'right']} />

              <div style={{ marginTop: 10, marginBottom: 6, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 11, fontWeight: 700, color: '#9ca3af', textTransform: 'uppercase' }}>Nav Links ({links.length})</span>
                <button
                  type="button"
                  onClick={addLink}
                  style={{ background: '#3b82f6', color: '#fff', border: 'none', borderRadius: 4, padding: '3px 8px', fontSize: 11, fontWeight: 600, cursor: 'pointer' }}
                >
                  + Add Link
                </button>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 8 }}>
                {links.map((link, idx) => (
                  <div key={link.id} style={{ background: '#111827', border: '1px solid #374151', borderRadius: 6, padding: 8 }}>
                    <div style={{ display: 'flex', gap: 4, marginBottom: 6, alignItems: 'center' }}>
                      <input
                        className="prop-input"
                        value={link.label}
                        onChange={e => updateLinks(links.map((l, i) => i === idx ? { ...l, label: e.target.value } : l))}
                        placeholder="Link label"
                        style={{ flex: 1 }}
                      />
                      <button
                        type="button"
                        onClick={() => moveLink(idx, -1)}
                        disabled={idx === 0}
                        style={{ background: '#374151', border: 'none', borderRadius: 4, color: idx === 0 ? '#4b5563' : '#d1d5db', cursor: idx === 0 ? 'default' : 'pointer', padding: '4px 6px', fontSize: 10 }}
                        title="Move up"
                      >↑</button>
                      <button
                        type="button"
                        onClick={() => moveLink(idx, 1)}
                        disabled={idx === links.length - 1}
                        style={{ background: '#374151', border: 'none', borderRadius: 4, color: idx === links.length - 1 ? '#4b5563' : '#d1d5db', cursor: idx === links.length - 1 ? 'default' : 'pointer', padding: '4px 6px', fontSize: 10 }}
                        title="Move down"
                      >↓</button>
                      <button
                        type="button"
                        onClick={() => updateLinks(links.filter((_, i) => i !== idx))}
                        style={{ background: '#374151', border: 'none', borderRadius: 4, color: '#ef4444', cursor: 'pointer', padding: '4px 6px', fontSize: 10 }}
                        title="Delete link"
                      >✕</button>
                    </div>
                    <select
                      className="prop-input"
                      value={link.pageId || ''}
                      onChange={e => updateLinks(links.map((l, i) => i === idx ? { ...l, pageId: e.target.value } : l))}
                    >
                      <option value="">Select destination page...</option>
                      {pages.map(pg => (
                        <option key={pg.id} value={pg.id}>{pg.name}</option>
                      ))}
                    </select>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // FEATURE 1: Image upload + extended image properties
        case 'image':
          return (
            <div style={{ padding: '0 12px' }}>
              {/* Upload from computer */}
              <div style={{ marginBottom: 10 }}>
                <label style={{ display: 'block', fontSize: 11, color: '#9ca3af', marginBottom: 4 }}>Upload from Computer</label>
                <button
                  className="upload-btn"
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                >
                  <Icon name="Upload" size={12} />
                  Choose Image File
                </button>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="image/*"
                  style={{ display: 'none' }}
                  onChange={(e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                      up('src', ev.target.result);
                      up('alt', file.name);
                    };
                    reader.readAsDataURL(file);
                    e.target.value = '';
                  }}
                />
              </div>
              {/* Preview thumbnail */}
              {p.src && (
                <div style={{ marginBottom: 8, borderRadius: 4, overflow: 'hidden', border: '1px solid #4b5563', background: '#374151' }}>
                  <img src={p.src} alt={p.alt} style={{ width: '100%', height: 80, objectFit: 'cover', display: 'block' }} />
                </div>
              )}
              {/* Or use URL */}
              <PropInput label="Or paste Image URL" value={p.src && p.src.startsWith('data:') ? '' : p.src} onChange={v => up('src', v)} />
              <PropInput label="Alt Text" value={p.alt} onChange={v => up('alt', v)} />
              <PropSelect label="Object Fit" value={p.objectFit} onChange={v => up('objectFit', v)} options={['cover','contain','fill','none','scale-down']} />
              {/* Image-specific visual properties */}
              <PropInput label="Border Radius (px)" type="number" min={0} value={p.borderRadius ?? 0} onChange={v => up('borderRadius', v)} />
              {/* Clear image */}
              {p.src && (
                <button
                  onClick={() => up('src', '')}
                  style={{ background: '#374151', border: '1px solid #4b5563', borderRadius: 4, color: '#ef4444', cursor: 'pointer', padding: '4px 8px', fontSize: 11, width: '100%', marginTop: 4 }}
                >
                  ✕ Clear Image
                </button>
              )}
            </div>
          );
        case 'container':
        case 'section':
          return (
            <div style={{ padding: '0 12px' }}>
              <PropColorPicker label="Background" value={p.bgColor} onChange={v => up('bgColor', v)} />
              <PropInput label="Padding" type="number" value={p.padding} onChange={v => up('padding', v)} />
              <PropInput label="Border Radius" type="number" value={p.borderRadius} onChange={v => up('borderRadius', v)} />
              <PropRow>

              <PropInput label="Field Label" value={p.labelText} onChange={v => up('labelText', v)} />
              <PropInput label="Placeholder" value={p.placeholder} onChange={v => up('placeholder', v)} />
              <PropSelect label="Input Type" value={p.inputType} onChange={v => up('inputType', v)} options={['text','email','password','number','tel','url','search']} />
              <PropColorPicker label="Border Color" value={p.borderColor} onChange={v => up('borderColor', v)} />
            </div>

            <div style={{ padding: '0 12px' }}>
              <PropColorPicker label="Color" value={p.color} onChange={v => up('color', v)} />
              <PropInput label="Thickness (px)" type="number" value={p.thickness} onChange={v => up('thickness', v)} />
            </div>

        default:
