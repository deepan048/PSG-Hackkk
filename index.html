    // =========================================================
    // PREVIEW MODE (full-screen multi-page overlay)
    // =========================================================
    function PreviewMode({ pages, initialPageId, deviceMode, onExit }) {
      const device = DEVICE_PRESETS[deviceMode] || DEVICE_PRESETS.desktop;
      const [fullscreen, setFullscreen] = useState(false);
      const [previewPageId, setPreviewPageId] = useState(() => {
        if (initialPageId && pages.some(p => p.id === initialPageId)) return initialPageId;
        const home = pages.find(p => p.isHome) || pages[0];
        return home?.id || '';
      });

      const currentPage = pages.find(p => p.id === previewPageId) || pages[0];
      const pageComponents = currentPage?.components || [];

      const handleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => setFullscreen(true)).catch(() => {});
        } else {
          document.exitFullscreen().then(() => setFullscreen(false)).catch(() => {});
        }
      };

      useEffect(() => {
        const onFsChange = () => setFullscreen(!!document.fullscreenElement);
        document.addEventListener('fullscreenchange', onFsChange);
        return () => document.removeEventListener('fullscreenchange', onFsChange);
      }, []);

      return (
        <div className="preview-fs-overlay">
          <div style={{
            width: device.width,
            margin: '0 auto',
            position: 'relative',
            minHeight: device.minHeight,
            background: '#fff',
          }}>
            {pageComponents.filter(c => c.visible).map(comp => (
              <CanvasComponent
                key={comp.id}
                comp={comp}
                preview={true}
                zoom={1}
                activePageIdOverride={previewPageId}
                onNavigatePage={(targetId) => {
                  if (pages.some(p => p.id === targetId)) {
                    setPreviewPageId(targetId);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }
                }}
              />
            ))}
          </div>
          <div className="preview-fs-exit" style={{ flexWrap: 'wrap', justifyContent: 'center' }}>
            {pages.length > 1 && (
              <div style={{ display: 'flex', gap: 4, background: '#171717', border: '1px solid #383838', padding: '5px 8px', borderRadius: 20, boxShadow: '0 4px 20px rgba(0,0,0,0.45)', alignItems: 'center' }}>
                {pages.map(pg => (
                  <button
                    key={pg.id}
                    onClick={() => setPreviewPageId(pg.id)}
                    style={{
                      border: 'none',
                      borderRadius: 14,
                      padding: '5px 12px',
                      fontSize: 12,
                      fontWeight: 600,
                      cursor: 'pointer',
                      background: pg.id === previewPageId ? '#10A37F' : 'transparent',
                      color: pg.id === previewPageId ? '#fff' : '#A3A3A3',
                    }}
                  >
                    {pg.name}
                  </button>
                ))}
              </div>
            )}
            <button
              className="preview-fs-btn"
              style={{ background: '#10A37F', color: '#fff' }}
              onClick={onExit}
            >
              ← Back to Craftify Editor
            </button>
            <button
              className="preview-fs-btn"
              style={{ background: '#2A2A2A', color: '#F5F5F5', border: '1px solid #383838' }}
              onClick={handleFullscreen}
            >
              {fullscreen ? '⊠ Exit Full Screen' : '⛶ Full Screen'}
            </button>
          </div>
        </div>
      );
    }

    // =========================================================
    // EXPORT HTML (Multi-Page Website Bundle)
    // =========================================================
    function exportHTML(pagesOrComponents, projectName, activePageId) {
      const pages = Array.isArray(pagesOrComponents) && pagesOrComponents[0]?.components !== undefined
        ? pagesOrComponents
        : [{ id: 'page_home', name: 'Home', slug: 'home', isHome: true, components: pagesOrComponents || [] }];
      const homePage = pages.find(p => p.isHome) || pages[0];
      const TEXT_TYPES = ['heading', 'paragraph', 'text'];

      const getPageFilename = (pg) => {
        if (!pg) return 'index.html';
        return pg.id === homePage.id ? 'index.html' : `${pg.slug || 'page'}.html`;
      };

      const renderCompHTML = (comp, currentPageId) => {
        const { type, props: p, style: s } = comp;
        if (!comp.visible) return '';

        const isText = TEXT_TYPES.includes(type);

        const baseStyles = {
          position: 'absolute',
          left: comp.x + 'px',
          top: comp.y + 'px',
          width: comp.width === 'auto' ? 'auto' : comp.width + 'px',
          height: isText ? 'auto' : (comp.height === 'auto' ? 'auto' : comp.height + 'px'),
          zIndex: comp.zIndex,
          opacity: s.opacity,
          'background-color': s.backgroundColor || undefined,
          'border-width': s.borderWidth ? s.borderWidth + 'px' : undefined,
          'border-style': s.borderWidth ? 'solid' : undefined,
          'border-color': s.borderColor,
          'border-radius': s.borderRadius ? s.borderRadius + 'px' : undefined,
          'box-shadow': s.boxShadow ? `0 0 ${s.shadowBlur}px ${s.shadowSpread}px ${s.shadowColor}` : undefined,
          'margin-top': s.marginTop ? s.marginTop + 'px' : undefined,
          'margin-right': s.marginRight ? s.marginRight + 'px' : undefined,
          'margin-bottom': s.marginBottom ? s.marginBottom + 'px' : undefined,
          'margin-left': s.marginLeft ? s.marginLeft + 'px' : undefined,
          'padding-top': s.paddingTop ? s.paddingTop + 'px' : undefined,
          'padding-right': s.paddingRight ? s.paddingRight + 'px' : undefined,
          'padding-bottom': s.paddingBottom ? s.paddingBottom + 'px' : undefined,
          'padding-left': s.paddingLeft ? s.paddingLeft + 'px' : undefined,
          'overflow': isText ? 'visible' : 'hidden',
          'overflow-wrap': isText ? 'break-word' : undefined,
          'word-wrap': isText ? 'break-word' : undefined,
        };

        const bs = Object.entries(baseStyles).filter(([,v]) => v !== undefined).map(([k,v]) => `${k}: ${v}`).join('; ');

        switch (type) {
          case 'heading':
            return `<h1 style="${bs}; font-size: ${p.fontSize}px; font-weight: ${p.fontWeight}; color: ${p.color}; text-align: ${p.textAlign}; line-height: ${p.lineHeight || 1.25}; margin: 0; padding: 4px; display: block;">${p.text}</h1>`;
          case 'paragraph':
            return `<p style="${bs}; font-size: ${p.fontSize}px; font-weight: ${p.fontWeight}; color: ${p.color}; line-height: ${p.lineHeight || 1.6}; text-align: ${p.textAlign}; margin: 0; padding: 4px; display: block;">${p.text}</p>`;
          case 'text':
            return `<span style="${bs}; font-size: ${p.fontSize}px; font-weight: ${p.fontWeight}; color: ${p.color}; line-height: ${p.lineHeight || 1.5}; display: block; padding: 4px;">${p.text}</span>`;
          case 'button': {
            if (p.targetPageId) {
              const dest = pages.find(pg => pg.id === p.targetPageId);
              const hrefFile = getPageFilename(dest);
              return `<a href="${hrefFile}" style="${bs}; display: inline-block; background-color: ${p.bgColor}; color: ${p.textColor}; border-radius: ${p.borderRadius}px; padding: ${p.paddingY}px ${p.paddingX}px; text-decoration: none; font-weight: 600; font-size: 14px; text-align: center; white-space: nowrap;">${p.label}</a>`;
            }
            return `<a href="${p.href || '#'}" style="${bs}; display: inline-block; background-color: ${p.bgColor}; color: ${p.textColor}; border-radius: ${p.borderRadius}px; padding: ${p.paddingY}px ${p.paddingX}px; text-decoration: none; font-weight: 600; font-size: 14px; text-align: center; white-space: nowrap;">${p.label}</a>`;
          }
          case 'navbar': {
            const links = Array.isArray(p.links) ? p.links : [];
            const justifyMap = { 'space-between': 'space-between', left: 'flex-start', center: 'center', right: 'flex-end' };
            const justify = justifyMap[p.align] || 'space-between';
            const brandHtml = p.showBrand !== false
              ? `<span style="font-weight: 700; font-size: ${(p.fontSize || 14) + 4}px; color: ${p.textColor || '#f8fafc'}; white-space: nowrap;">${p.brandText || 'MySite'}</span>`
              : '';
            const linksHtml = links.map(link => {
              const dest = pages.find(pg => pg.id === link.pageId);
              const hrefFile = dest ? getPageFilename(dest) : '#';
              const isActive = link.pageId === currentPageId;
              const col = isActive ? (p.activeColor || '#3b82f6') : (p.textColor || '#f8fafc');
              const border = isActive ? `2px solid ${p.activeColor || '#3b82f6'}` : '2px solid transparent';
              return `<a href="${hrefFile}" style="color: ${col}; font-size: ${p.fontSize || 14}px; font-weight: ${isActive ? 700 : 500}; text-decoration: none; white-space: nowrap; border-bottom: ${border}; padding-bottom: 2px;">${link.label}</a>`;
            }).join('');
            return `<nav style="${bs}; background-color: ${p.bgColor || '#1e293b'}; color: ${p.textColor || '#f8fafc'}; display: flex; align-items: center; justify-content: ${justify}; padding-left: ${p.paddingX ?? 24}px; padding-right: ${p.paddingX ?? 24}px; gap: ${p.gap ?? 20}px; box-sizing: border-box;">${brandHtml}<div style="display: flex; align-items: center; gap: ${p.gap ?? 20}px; flex-wrap: wrap;">${linksHtml}</div></nav>`;
          }
          case 'image':
            return p.src ? `<img src="${p.src}" alt="${p.alt}" style="${bs}; object-fit: ${p.objectFit}; border-radius: ${p.borderRadius || 0}px;" />` : `<div style="${bs}; background: #e5e7eb; display: flex; align-items: center; justify-content: center; color: #9ca3af;">No Image</div>`;
          case 'container':
            return `<div style="${bs}; background-color: ${p.bgColor || 'transparent'}; padding: ${p.padding}px; border-radius: ${p.borderRadius}px; border: ${p.borderWidth}px solid ${p.borderColor};"></div>`;
          case 'section':
            return `<div style="${bs}; background-color: ${p.bgColor}; padding: ${p.padding}px; border: ${p.borderWidth}px solid ${p.borderColor};"></div>`;
          case 'card':
            return `<div style="${bs}; height: auto; overflow: visible; background-color: ${p.bgColor}; border-radius: ${p.borderRadius}px; padding: 24px; ${p.shadow ? 'box-shadow: 0 10px 25px rgba(0,0,0,0.12);' : ''}"><h3 style="margin: 0 0 8px; font-size: 18px; font-weight: 700; color: #1a1a1a; line-height: 1.3; overflow-wrap: break-word;">${p.title}</h3><p style="margin: 0; font-size: 14px; color: #6b7280; line-height: 1.5; overflow-wrap: break-word;">${p.body}</p></div>`;
          case 'input':
            return `<div style="${bs}; padding: 4px;">${p.labelText ? `<label style="display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px;">${p.labelText}</label>` : ''}<input type="${p.inputType}" placeholder="${p.placeholder}" style="width: 100%; padding: 8px 12px; border: 1px solid ${p.borderColor}; border-radius: 6px; font-size: 14px; color: #374151; box-sizing: border-box;" /></div>`;
          case 'divider':
            return `<hr style="${bs}; border-color: ${p.color}; border-top-width: ${p.thickness}px; border-style: solid; border-bottom: none; border-left: none; border-right: none; margin: 0;" />`;
          default:
            return `<div style="${bs}"></div>`;
        }
      };

      // Export each page as a separate, linked HTML file (index.html for homepage, <slug>.html for others)
      pages.forEach((pg, index) => {
        const filename = getPageFilename(pg);
        const pageHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${projectName} — ${pg.name}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; display: flex; justify-content: center; }
    .page { position: relative; width: 1280px; min-height: 900px; background: white; }
  </style>
</head>
<body>
  <div class="page">
    ${(pg.components || []).filter(c => c.visible).map(c => renderCompHTML(c, pg.id)).join('\n    ')}
  </div>
</body>
</html>`;

        setTimeout(() => {
          const blob = new Blob([pageHtml], { type: 'text/html' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
        }, index * 180);
      });
    }

    // =========================================================
    // TOOLBAR
    // =========================================================
    function Toolbar({ onOpenTemplates, onOpenTheme, zoom, setZoom, fitMode, setFitMode, handleFitToScreen, leftPanelOpen, setLeftPanelOpen, rightPanelOpen, setRightPanelOpen }) {
      const { state, dispatch } = useStudio();
      const { projectName, previewMode, history, historyIndex, components, pages, activePageId, deviceMode } = state;
      const [saved, setSaved] = useState(false);

      const canUndo = historyIndex > 0;
      const canRedo = historyIndex < history.length - 1;

      const handleSave = () => {
        try {
          const syncedPages = (pages || []).map(p =>
            p.id === activePageId ? { ...p, components } : p
          );
          localStorage.setItem('vds_project', JSON.stringify({ pages: syncedPages, activePageId, components, projectName }));
          setSaved(true);
          setTimeout(() => setSaved(false), 2000);
        } catch (e) { alert('Save failed: ' + e.message); }
      };

      const handleLoad = () => {
        try {
          const data = localStorage.getItem('vds_project');
          if (!data) { alert('No saved project found.'); return; }
          const parsed = JSON.parse(data);
          if (confirm('Load saved project? This will replace current canvas.')) {
            if (Array.isArray(parsed.pages) && parsed.pages.length > 0) {
              dispatch({ type: 'LOAD_MULTI_PAGE_PROJECT', payload: { pages: parsed.pages, activePageId: parsed.activePageId, projectName: parsed.projectName } });
            } else {
              dispatch({ type: 'LOAD_PROJECT', payload: parsed.components || [] });
              if (parsed.projectName) dispatch({ type: 'SET_PROJECT_NAME', payload: parsed.projectName });
            }
          }
        } catch (e) { alert('Load failed: ' + e.message); }
      };

      const ToolBtn = ({ onClick, disabled, tip, children, active }) => (
        <button
          onClick={onClick}
          disabled={disabled}
          title={tip}
          style={{
            background: active ? '#10A37F' : '#2A2A2A',
            border: '1px solid #383838',
            borderRadius: 6,
            padding: '6px 10px',
            cursor: disabled ? 'not-allowed' : 'pointer',
            color: disabled ? '#525252' : active ? '#fff' : '#F5F5F5',
            display: 'flex',
            alignItems: 'center',
            gap: 6,
            fontSize: 12,
            fontWeight: 500,
            transition: 'all 0.15s',
          }}
        >
          {children}
        </button>
      );

      return (
        <div className="toolbar" style={{ height: 52, display: 'flex', alignItems: 'center', paddingLeft: 16, paddingRight: 16, gap: 8, flexShrink: 0 }}>
          {/* Logo */}
          <div style={{ display: 'flex', alignItems: 'center', marginRight: 10 }}>
            <span
              className="gradient-text"
              style={{
                fontFamily: "'Playfair Display', Georgia, serif",
                fontSize: 19,
                fontWeight: 800,
                letterSpacing: '-0.02em',
                lineHeight: 1.1,
              }}
            >
              Craftify
            </span>
          </div>

          {/* Panel toggles */}
          <button
            className={`panel-toggle-btn ${leftPanelOpen ? 'open' : ''}`}
            onClick={() => setLeftPanelOpen(o => !o)}
            title={leftPanelOpen ? 'Hide left panel' : 'Show left panel'}
          >◫</button>
          <button
            className={`panel-toggle-btn ${rightPanelOpen ? 'open' : ''}`}
            onClick={() => setRightPanelOpen(o => !o)}
            title={rightPanelOpen ? 'Hide right panel' : 'Show right panel'}
          >◨</button>

          {/* Project name */}
          <input
            value={projectName}
            onChange={e => dispatch({ type: 'SET_PROJECT_NAME', payload: e.target.value })}
            style={{ background: '#2A2A2A', border: '1px solid #383838', borderRadius: 6, padding: '5px 12px', color: '#F5F5F5', fontSize: 13, fontWeight: 600, width: 140, textAlign: 'center', marginLeft: 4 }}
          />

          {/* Active Page Quick Switcher */}
          <select
            value={activePageId}
            onChange={e => dispatch({ type: 'SWITCH_PAGE', payload: e.target.value })}
            title="Switch active page"
            style={{ background: '#2A2A2A', border: '1px solid #10A37F', borderRadius: 6, padding: '5px 8px', color: '#F5F5F5', fontSize: 12, fontWeight: 600, cursor: 'pointer', outline: 'none' }}
          >
            {(pages || []).map(pg => (
              <option key={pg.id} value={pg.id}>
                {pg.isHome ? '🏠 ' : '📄 '}{pg.name}
              </option>
            ))}
          </select>

          <div style={{ flex: 1 }} />

          {/* Zoom controls */}
          <div className="zoom-bar" title="Zoom controls">
            <button className="zoom-btn" onClick={() => { setZoom(z => Math.max(0.1, parseFloat((z - 0.1).toFixed(2)))); setFitMode(false); }} title="Zoom Out">−</button>
            <span className="zoom-pct">{Math.round((zoom || 1) * 100)}%</span>
            <button className="zoom-btn" onClick={() => { setZoom(z => Math.min(2, parseFloat((z + 0.1).toFixed(2)))); setFitMode(false); }} title="Zoom In">+</button>
            <button className="zoom-btn" onClick={() => { setZoom(1); setFitMode(false); }} title="Reset Zoom (1:1)">1:1</button>
            <button className={`zoom-btn ${fitMode ? 'active' : ''}`} onClick={handleFitToScreen} title="Fit to Screen">⊡</button>
          </div>

          {/* Device switcher */}
          <div style={{
            display: 'flex',
            alignItems: 'center',
            gap: 2,
            background: '#2A2A2A',
            border: '1px solid #383838',
            borderRadius: 8,
            padding: 3,
            marginLeft: 4,
          }}>
            {Object.entries(DEVICE_PRESETS).map(([key, preset]) => (
              <button
                key={key}
                onClick={() => dispatch({ type: 'SET_DEVICE', payload: key })}
                title={`${preset.label} (${preset.shortcut})`}
                style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: 5,
                  padding: '5px 10px',
                  borderRadius: 6,
                  border: 'none',
                  cursor: 'pointer',
                  fontSize: 12,
                  fontWeight: 600,
                  transition: 'all 0.15s',
                  background: state.deviceMode === key ? '#10A37F' : 'transparent',
                  color: state.deviceMode === key ? '#fff' : '#A3A3A3',
                }}
              >
                <Icon name={preset.icon} size={14} />
                <span style={{ display: state.deviceMode === key ? 'inline' : 'none' }}>{preset.label}</span>
              </button>
            ))}
          </div>

          {/* Right-side action buttons */}
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            {/* Templates & Theme buttons */}
            <ToolBtn onClick={onOpenTemplates} tip="Template Gallery">
              <Icon name="Layout" size={14} />
              <span>Templates</span>
            </ToolBtn>
            <ToolBtn onClick={onOpenTheme} tip="Global Design Settings">
              <Icon name="Settings" size={14} />
              <span>Theme</span>
            </ToolBtn>
            <div style={{ width: 1, height: 24, background: '#374151', margin: '0 4px' }} />
            <ToolBtn onClick={() => dispatch({ type: 'UNDO' })} disabled={!canUndo} tip="Undo (Ctrl+Z)">
              <Icon name="RotateCcw" size={14} />
              <span>Undo</span>
            </ToolBtn>
            <ToolBtn onClick={() => dispatch({ type: 'REDO' })} disabled={!canRedo} tip="Redo (Ctrl+Y)">
              <Icon name="RotateCw" size={14} />
              <span>Redo</span>
            </ToolBtn>

            <div style={{ width: 1, height: 24, background: '#374151', margin: '0 4px' }} />

            <ToolBtn onClick={() => dispatch({ type: 'SET_PREVIEW', payload: !previewMode })} active={previewMode} tip="Toggle Preview">
              <Icon name={previewMode ? 'StopCircle' : 'Play'} size={14} />
              <span>{previewMode ? 'Exit Preview' : 'Preview'}</span>
            </ToolBtn>

            <ToolBtn onClick={() => {
              const syncedPages = (pages || []).map(p => p.id === activePageId ? { ...p, components } : p);
              exportHTML(syncedPages, projectName, activePageId);
            }} tip="Export Multi-Page HTML">
              <Icon name="Download" size={14} />
              <span>Export</span>
            </ToolBtn>

            <ToolBtn onClick={handleSave} tip="Save to localStorage">
              <Icon name="Save" size={14} />
              <span>{saved ? '✓ Saved' : 'Save'}</span>
            </ToolBtn>

            <ToolBtn onClick={handleLoad} tip="Load saved project">
              <Icon name="RotateCcw" size={14} />
              <span>Load</span>
            </ToolBtn>

            <div style={{ width: 1, height: 24, background: '#374151', margin: '0 4px' }} />

            <ToolBtn onClick={() => { if (confirm('Clear canvas? This cannot be undone easily.')) dispatch({ type: 'CLEAR_CANVAS' }); }} tip="Clear Canvas">
              <Icon name="Trash2" size={14} />
              <span>Clear</span>
            </ToolBtn>
          </div>
        </div>
      );
    }

    // =========================================================
    // APP ROOT
    // =========================================================
    function App() {
      const [state, dispatch] = useReducer(reducer, initialState);

      // Global theme state
      const [theme, setTheme] = useState(() => {
        try {
          const saved = localStorage.getItem('vds_active_theme');
          return saved ? JSON.parse(saved) : { ...DEFAULT_THEME };
        } catch { return { ...DEFAULT_THEME }; }
      });

      // Persist active theme on change
      useEffect(() => {
        try { localStorage.setItem('vds_active_theme', JSON.stringify(theme)); } catch {}
      }, [theme]);

      // Modal states
      const [showTemplates, setShowTemplates] = useState(false);
      const [showTheme, setShowTheme] = useState(false);

      // Zoom / panel states
      const [zoom, setZoom] = useState(1);
      const [fitMode, setFitMode] = useState(false);
      const [leftPanelOpen, setLeftPanelOpen] = useState(true);
      const [rightPanelOpen, setRightPanelOpen] = useState(true);

      // Fit-to-screen: scale canvas to fit available workspace
      const handleFitToScreen = useCallback(() => {
        const device = DEVICE_PRESETS[state.deviceMode] || DEVICE_PRESETS.desktop;
        const leftW  = leftPanelOpen  ? 220 : 0;
        const rightW = rightPanelOpen ? 260 : 0;
        const availW = window.innerWidth  - leftW - rightW - 80;
        const availH = window.innerHeight - 52  - 80;
        const scaleW = availW / device.width;
        const scaleH = availH / device.minHeight;
        const newZoom = Math.min(scaleW, scaleH, 1);
        setZoom(Math.max(0.1, parseFloat(newZoom.toFixed(2))));
        setFitMode(true);
      }, [state.deviceMode, leftPanelOpen, rightPanelOpen]);

      // Apply Google Font when fontFamily changes
      useEffect(() => {
        const fontName = theme.fontFamily.split(',')[0].replace(/['"]/g, '').trim();
        const systemFonts = ['system-ui','-apple-system','BlinkMacSystemFont','Segoe UI','sans-serif','serif'];
        if (!systemFonts.some(sf => fontName.toLowerCase().includes(sf.toLowerCase()))) {
          const id = 'vds-gfont';
          let el = document.getElementById(id);
          if (!el) { el = document.createElement('link'); el.id = id; el.rel = 'stylesheet'; document.head.appendChild(el); }
          el.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontName)}:wght@400;600;700&display=swap`;
        }
      }, [theme.fontFamily]);

      // FEATURE 2: Clipboard for Copy/Paste
      const clipboardRef = useRef(null);

      // Keyboard shortcuts — FEATURE 2 (Ctrl+C, Ctrl+V added; Ctrl+D, Ctrl+Z, Ctrl+Y, Delete already existed)
      useEffect(() => {
        const handler = (e) => {
          const tag = document.activeElement?.tagName;
          const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

          // Delete / Backspace
          if ((e.key === 'Delete' || e.key === 'Backspace') && !inInput) {
            if (state.selectedId) {
              const comp = state.components.find(c => c.id === state.selectedId);
              if (comp && !comp.locked) dispatch({ type: 'DELETE_COMPONENT', payload: state.selectedId });
            }
          }

          // Undo
          if (e.ctrlKey && e.key === 'z' && !e.shiftKey) {
            e.preventDefault();
            dispatch({ type: 'UNDO' });
          }

          // Redo (Ctrl+Y or Ctrl+Shift+Z)
          if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) {
            e.preventDefault();
            dispatch({ type: 'REDO' });
          }

          // FEATURE 2: Copy (Ctrl+C)
          if (e.ctrlKey && e.key === 'c' && !inInput) {
            if (state.selectedId) {
              const comp = state.components.find(c => c.id === state.selectedId);
              if (comp) {
                clipboardRef.current = JSON.parse(JSON.stringify(comp));
              }
            }
          }

          // FEATURE 2: Paste (Ctrl+V)
          if (e.ctrlKey && e.key === 'v' && !inInput) {
            e.preventDefault();
            const cb = clipboardRef.current;
            if (cb) {
              const newComp = {
                ...JSON.parse(JSON.stringify(cb)),
                id: genId(),
                x: cb.x + 24,
                y: cb.y + 24,
                label: cb.label + ' Copy',
                locked: false,
              };
              dispatch({ type: 'ADD_COMPONENT', payload: newComp });
            }
          }

          // FEATURE 4: Duplicate (Ctrl+D)
          if (e.ctrlKey && e.key === 'd') {
            e.preventDefault();
            if (state.selectedId) dispatch({ type: 'DUPLICATE_COMPONENT', payload: state.selectedId });
          }

          // Escape — deselect
          if (e.key === 'Escape') {
            dispatch({ type: 'SELECT_COMPONENT', payload: null });
          }

          // Arrow key nudge
          if (!inInput && state.selectedId) {
            const nudge = e.shiftKey ? 10 : 1;
            const comp = state.components.find(c => c.id === state.selectedId);
            if (!comp || comp.locked) return;
            if (e.key === 'ArrowLeft')  { e.preventDefault(); dispatch({ type: 'UPDATE_COMPONENT', payload: { id: comp.id, updates: { x: comp.x - nudge } } }); }
            if (e.key === 'ArrowRight') { e.preventDefault(); dispatch({ type: 'UPDATE_COMPONENT', payload: { id: comp.id, updates: { x: comp.x + nudge } } }); }
            if (e.key === 'ArrowUp')    { e.preventDefault(); dispatch({ type: 'UPDATE_COMPONENT', payload: { id: comp.id, updates: { y: comp.y - nudge } } }); }
            if (e.key === 'ArrowDown')  { e.preventDefault(); dispatch({ type: 'UPDATE_COMPONENT', payload: { id: comp.id, updates: { y: comp.y + nudge } } }); }
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [state.selectedId, state.components]);

      // Auto-load saved project on start
      useEffect(() => {
        try {
          const data = localStorage.getItem('vds_project');
          if (data) {
            const parsed = JSON.parse(data);
            if (Array.isArray(parsed.pages) && parsed.pages.length > 0) {
              const hasAny = parsed.pages.some(p => (p.components || []).length > 0);
              if (hasAny && window.confirm('A saved multi-page project was found. Load it?')) {
                dispatch({ type: 'LOAD_MULTI_PAGE_PROJECT', payload: { pages: parsed.pages, activePageId: parsed.activePageId, projectName: parsed.projectName } });
              }
            } else if (parsed.components && parsed.components.length > 0) {
              const restore = window.confirm('A saved project was found. Load it?');
              if (restore) {
                // Migrate older saved data: ensure locked field exists
                const migrated = parsed.components.map(c => ({ locked: false, ...c }));
                dispatch({ type: 'LOAD_PROJECT', payload: migrated });
                if (parsed.projectName) dispatch({ type: 'SET_PROJECT_NAME', payload: parsed.projectName });
              }
            }
          }
        } catch (e) { /* ignore */ }
      }, []);

      return (
        <StudioContext.Provider value={{ state, dispatch }}>
          {/* Full-screen preview mode — replaces editor UI */}
          {state.previewMode ? (
            <PreviewMode
              pages={(state.pages || []).map(p => p.id === state.activePageId ? { ...p, components: state.components } : p)}
              initialPageId={state.activePageId}
              deviceMode={state.deviceMode}
              onExit={() => dispatch({ type: 'SET_PREVIEW', payload: false })}
            />
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', overflow: 'hidden' }}>
              <Toolbar
                onOpenTemplates={() => setShowTemplates(true)}
                onOpenTheme={() => setShowTheme(true)}
                zoom={zoom}
                setZoom={setZoom}
                fitMode={fitMode}
                setFitMode={setFitMode}
                handleFitToScreen={handleFitToScreen}
                leftPanelOpen={leftPanelOpen}
                setLeftPanelOpen={setLeftPanelOpen}
                rightPanelOpen={rightPanelOpen}
                setRightPanelOpen={setRightPanelOpen}
              />
              <div style={{ display: 'flex', flex: 1, minHeight: 0, overflow: 'hidden' }}>
                {/* Collapsible left panel */}
                <div style={{ width: leftPanelOpen ? 220 : 0, height: '100%', minHeight: 0, display: 'flex', flexDirection: 'column', overflow: 'hidden', transition: 'width 0.2s ease', flexShrink: 0 }}>
                  <ComponentLibrary />
                </div>
                <Canvas zoom={zoom} fitMode={fitMode} />
                {/* Collapsible right panel */}
                <div style={{ width: rightPanelOpen ? 260 : 0, height: '100%', minHeight: 0, display: 'flex', flexDirection: 'column', overflow: 'hidden', transition: 'width 0.2s ease', flexShrink: 0 }}>
                  <PropertiesPanel />
                </div>
              </div>
            </div>
          )}
          {/* Modals (always rendered, even in preview) */}
          {showTemplates && (
            <TemplateGallery theme={theme} setTheme={setTheme} onClose={() => setShowTemplates(false)} />
          )}
          {showTheme && (
            <ThemePanel theme={theme} setTheme={setTheme} onClose={() => setShowTheme(false)} />
          )}
        </StudioContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
