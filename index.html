<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftify — Website Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #212121; color: #F5F5F5; }

    /* Canvas dot grid */
    .canvas-area {
      background-color: #212121;
      background-image: radial-gradient(circle, #383838 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #171717; }
    ::-webkit-scrollbar-thumb { background: #383838; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b4b4b; }

    /* Resize handles */
    .resize-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #10A37F;
      border: 2px solid #fff;
      border-radius: 50%;
      z-index: 1000;
    }

    /* Selection border */
    .component-selected {
      outline: 2px solid #10A37F;
      outline-offset: 1px;
    }

    /* Locked selection border */
    .component-locked-selected {
      outline: 2px solid #f59e0b;
      outline-offset: 1px;
    }

    /* Component wrapper */
    .component-wrapper {
      position: absolute;
      cursor: grab;
      user-select: none;
      /* Wrapper must never clip text content that grows taller than the
         initially stored height. overflow:visible is the safe default. */
      overflow: visible;
    }
    .component-wrapper:active { cursor: grabbing; }
    .component-wrapper.locked { cursor: default !important; }

    /* Color input styling */
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      cursor: pointer;
      border-radius: 4px;
      padding: 2px;
      background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border-radius: 3px; border: none; }

    /* Panel inputs */
    .prop-input {
      background: #2A2A2A;
      color: #F5F5F5;
      border: 1px solid #383838;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      width: 100%;
    }
    .prop-input:focus {
      outline: none;
      border-color: #10A37F;
    }

    /* Sidebar tile drag */
    .component-tile {
      cursor: grab;
      transition: all 0.15s ease;
    }
    .component-tile:active { cursor: grabbing; opacity: 0.7; }
    .component-tile:hover { background: #303030 !important; border-color: #10A37F !important; }

    /* Layer item hover */
    .layer-item:hover { background: #303030 !important; }

    /* Layer drag over */
    .layer-drag-over { background: #343434 !important; border-top: 2px solid #10A37F !important; }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #10A37F, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Preview mode overlay */
    .preview-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #10A37F;
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(16,163,127,0.45);
      cursor: pointer;
    }

    /* Toolbar */
    .toolbar {
      background: #171717;
      border-bottom: 1px solid #383838;
    }

    /* Transition for panel toggles */
    .panel-transition {
      transition: all 0.2s ease;
    }

    /* Container dashed border in editor */
    .container-editor-hint {
      border: 2px dashed #6b7280 !important;
    }

    /* Tooltip */
    .tooltip {
      position: relative;
    }
    .tooltip:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1f2937;
      color: #e5e7eb;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 9999;
      border: 1px solid #374151;
    }

    /* Animate drop */
    @keyframes dropPop {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
    .drop-anim { animation: dropPop 0.15s ease forwards; }

    /* Device switcher button hover */
    .device-btn:hover { background: #303030 !important; color: #F5F5F5 !important; }

    /* Canvas page responsive transition */
    .canvas-page {
      transition: width 0.3s cubic-bezier(0.4,0,0.2,1), border-radius 0.3s ease;
      /* Allow text that wraps taller than expected to be visible and scroll-reachable */
      overflow: visible;
    }

    /* Image upload button */
    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      background: #10A37F;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .upload-btn:hover { background: #0d8f6f; }

    /* Layer rename input */
    .layer-rename-input {
      background: #2A2A2A;
      color: #F5F5F5;
      border: 1px solid #10A37F;
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 12px;
      width: 100%;
      outline: none;
    }

    /* Lock icon badge on canvas */
    .lock-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #f59e0b;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      z-index: 1001;
      pointer-events: none;
    }

    /* ===== MODAL OVERLAY ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-box {
      background: #212121;
      border: 1px solid #383838;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #383838;
      background: #171717;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-close {
      background: none;
      border: none;
      color: #A3A3A3;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .modal-close:hover { color: #ef4444; }

    /* Template cards */
    .tpl-card {
      background: #2A2A2A;
      border: 2px solid #383838;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }
    .tpl-card:hover { border-color: #10A37F; transform: translateY(-2px); }
    .tpl-preview {
      width: 100%;
      height: 160px;
      position: relative;
      overflow: hidden;
      background: #fff;
    }
    .tpl-info { padding: 12px; }

    /* Use template button */
    .use-tpl-btn {
      width: 100%;
      padding: 8px;
      background: #10A37F;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .use-tpl-btn:hover { background: #0d8f6f; }

    /* Custom templates & management */
    .save-tpl-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: #10A37F;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .save-tpl-btn:hover { background: #0d8f6f; }
    .save-tpl-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .tpl-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #383838;
    }
    .tpl-actions-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .tpl-icon-btn {
      padding: 6px 9px;
      background: #212121;
      border: 1px solid #383838;
      border-radius: 6px;
      color: #F5F5F5;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .tpl-icon-btn:hover { border-color: #10A37F; color: #fff; background: #303030; }
    .tpl-icon-btn.danger:hover { border-color: #ef4444; color: #fca5a5; }
    .tpl-empty-state {
      border: 1px dashed #383838;
      border-radius: 10px;
      padding: 28px 20px;
      text-align: center;
      color: #A3A3A3;
      background: #171717;
    }
    .tpl-filter-pill {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid #383838;
      background: #2A2A2A;
      color: #A3A3A3;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tpl-filter-pill.active {
      background: #10A37F;
      border-color: #10A37F;
      color: #fff;
    }

    /* Theme panel color swatch */
    .theme-swatch {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 2px solid #383838;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }
    .theme-swatch:hover { border-color: #10A37F; }
    .saved-theme-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #383838;
      background: #2A2A2A;
      color: #F5F5F5;
      cursor: pointer;
      font-size: 11px;
      transition: border-color 0.15s;
      white-space: nowrap;
    }
    .saved-theme-btn:hover { border-color: #10A37F; color: #fff; }

    /* ===== ZOOM CONTROLS ===== */
    .zoom-bar {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #2A2A2A;
      border: 1px solid #383838;
      border-radius: 8px;
      padding: 3px 5px;
    }
    .zoom-btn {
      background: none;
      border: none;
      color: #A3A3A3;
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }
    .zoom-btn:hover { background: #303030; color: #F5F5F5; }
    .zoom-btn.active { color: #10A37F; }
    .zoom-pct {
      font-size: 11px;
      color: #F5F5F5;
      min-width: 38px;
      text-align: center;
      font-weight: 600;
      user-select: none;
    }

    /* ===== PANEL COLLAPSE TOGGLE ===== */
    .panel-toggle-btn {
      background: #2A2A2A;
      border: 1px solid #383838;
      border-radius: 5px;
      color: #A3A3A3;
      cursor: pointer;
      padding: 5px 7px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, color 0.1s;
      flex-shrink: 0;
    }
    .panel-toggle-btn:hover { background: #303030; color: #F5F5F5; }
    .panel-toggle-btn.open { color: #10A37F; border-color: #10A37F; }

    /* ===== FULL-SCREEN PREVIEW ===== */
    .preview-fs-overlay {
      position: fixed;
      inset: 0;
      background: #f9fafb;
      z-index: 9000;
      overflow-y: auto;
      overflow-x: auto;
    }
    .preview-fs-exit {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 9100;
    }
    .preview-fs-btn {
      border: none;
      border-radius: 20px;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: opacity 0.15s;
    }
    .preview-fs-btn:hover { opacity: 0.9; }
  </style>
</head>
<body class="overflow-hidden" style="background: #212121; color: #F5F5F5;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useReducer, useContext, useRef, useEffect, useCallback, useMemo, createContext } = React;

    // =========================================================
    // ICON HELPERS
    // =========================================================
    const LU = window.LucideReact || {};
    const Icon = ({ name, size = 16, className = '', style = {} }) => {
      const Comp = LU[name];
      if (!Comp) {
        const fallbacks = { Type:'T', Heading1:'H', AlignLeft:'¶', MousePointer:'↖', Square:'□', Image:'🖼', Layout:'▤', Columns:'⫿', CreditCard:'▭', InputType:'⌨', Minus:'—', Trash2:'🗑', Eye:'👁', EyeOff:'🙈', ChevronDown:'▾', ChevronRight:'▸', Move:'✥', RotateCcw:'↩', RotateCw:'↪', Download:'⬇', Save:'💾', Play:'▶', StopCircle:'⏹', Plus:'➕', Copy:'⧉', GripVertical:'⠿', Zap:'⚡', PanelLeft:'◫', Bold:'B', Italic:'I', Underline:'U', Link:'🔗', Settings:'⚙', X:'✕', Check:'✓', AlertCircle:'⚠', Info:'ℹ', Monitor:'🖥', Tablet:'⬜', Smartphone:'📱', Lock:'🔒', Unlock:'🔓', Upload:'⬆', Pencil:'✎', Clipboard:'📋', Menu:'☰', Home:'🏠', FileText:'📄', ArrowUp:'↑', ArrowDown:'↓' };
        return <span className={className} style={{ fontSize: size * 0.75, lineHeight: 1, ...style }}>{fallbacks[name] || '?'}</span>;
      }
      return <Comp size={size} className={className} style={style} />;
    };

    // =========================================================
    // CONSTANTS
    // =========================================================
    const COMPONENT_TYPES = [
      { type: 'heading',   label: 'Heading',     icon: 'Heading1' },
      { type: 'paragraph', label: 'Paragraph',   icon: 'AlignLeft' },
      { type: 'text',      label: 'Text',        icon: 'Type' },
      { type: 'button',    label: 'Button',      icon: 'Square' },
      { type: 'navbar',    label: 'Nav Bar',     icon: 'Menu' },
      { type: 'image',     label: 'Image',       icon: 'Image' },
      { type: 'container', label: 'Container',   icon: 'Layout' },
      { type: 'section',   label: 'Section',     icon: 'Columns' },
      { type: 'card',      label: 'Card',        icon: 'CreditCard' },
      { type: 'input',     label: 'Input Field', icon: 'MousePointer' },
      { type: 'divider',   label: 'Divider',     icon: 'Minus' },
    ];

    let idCounter = 0;
    const genId = () => `comp_${Date.now()}_${++idCounter}`;
    const genPageId = () => `page_${Date.now()}_${++idCounter}`;
    const slugifyPage = (name) => (name || 'page').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'page';

    const DEFAULT_PROPS = {
      heading:   { text: 'Heading', fontSize: 32, fontWeight: 'bold', color: '#1a1a1a', textAlign: 'left', lineHeight: 1.25 },
      paragraph: { text: 'This is a paragraph. Click to edit.', fontSize: 16, fontWeight: 'normal', color: '#374151', lineHeight: 1.6, textAlign: 'left' },
      text:      { text: 'Text element', fontSize: 14, fontWeight: 'normal', color: '#374151', textAlign: 'left', lineHeight: 1.5 },
      button:    { label: 'Click Me', bgColor: '#3b82f6', textColor: '#ffffff', borderRadius: 6, paddingX: 16, paddingY: 8, href: '', targetPageId: '' },
      navbar:    {
        brandText: 'MySite',
        showBrand: true,
        bgColor: '#1e293b',
        textColor: '#f8fafc',
        activeColor: '#3b82f6',
        fontSize: 14,
        paddingX: 24,
        gap: 20,
        align: 'space-between',
        links: [
          { id: 'nl_1', label: 'Home', pageId: 'page_home' },
          { id: 'nl_2', label: 'About', pageId: 'page_about' },
          { id: 'nl_3', label: 'Services', pageId: 'page_services' },
          { id: 'nl_4', label: 'Contact', pageId: 'page_contact' },
        ],
      },
      image:     { src: '', alt: 'Image', objectFit: 'cover', borderRadius: 0 },
      container: { bgColor: 'transparent', padding: 16, borderRadius: 8, borderWidth: 2, borderColor: '#d1d5db', gap: 8 },
      section:   { bgColor: '#f9fafb', padding: 40, borderRadius: 0, borderWidth: 0, borderColor: '#e5e7eb', gap: 16 },
      card:      { title: 'Card Title', body: 'Card body content goes here.', bgColor: '#ffffff', borderRadius: 12, shadow: true },
      input:     { placeholder: 'Enter text...', labelText: 'Label', inputType: 'text', borderColor: '#d1d5db' },
      divider:   { color: '#d1d5db', thickness: 1 },
    };

    const DEFAULT_STYLE = {
      backgroundColor: '', opacity: 1,
      borderWidth: 0, borderColor: '#000000', borderRadius: 0,
      boxShadow: false, shadowBlur: 10, shadowSpread: 0, shadowColor: 'rgba(0,0,0,0.3)',
      marginTop: 0, marginRight: 0, marginBottom: 0, marginLeft: 0,
      paddingTop: 0, paddingRight: 0, paddingBottom: 0, paddingLeft: 0,
    };

    const DEFAULT_SIZES = {
      heading:   { width: 400, height: 'auto' },
      paragraph: { width: 400, height: 'auto' },
      text:      { width: 200, height: 'auto' },
      button:    { width: 'auto', height: 'auto' },
      navbar:    { width: 1280, height: 64 },
      image:     { width: 300, height: 200 },
      container: { width: 400, height: 200 },
      section:   { width: 700, height: 200 },
      card:      { width: 300, height: 'auto' },
      input:     { width: 300, height: 'auto' },
      divider:   { width: 400, height: 'auto' },
    };

    // =========================================================
    // DEVICE PRESETS
    // =========================================================
    const DEVICE_PRESETS = {
      desktop: { width: 1280, minHeight: 900,  label: 'Desktop', icon: 'Monitor',    shortcut: '1920×1080' },
      tablet:  { width: 768,  minHeight: 1024, label: 'Tablet',  icon: 'Tablet',     shortcut: '768×1024'  },
      mobile:  { width: 375,  minHeight: 812,  label: 'Mobile',  icon: 'Smartphone', shortcut: '375×812'   },
    };

    // =========================================================
    // STATE / REDUCER (Multi-Page Architecture)
    // =========================================================
    function createDefaultPages() {
      return [
        { id: 'page_home',     name: 'Home',     slug: 'home',     isHome: true,  components: [], history: [[]], historyIndex: 0 },
        { id: 'page_about',    name: 'About',    slug: 'about',    isHome: false, components: [], history: [[]], historyIndex: 0 },
        { id: 'page_services', name: 'Services', slug: 'services', isHome: false, components: [], history: [[]], historyIndex: 0 },
        { id: 'page_contact',  name: 'Contact',  slug: 'contact',  isHome: false, components: [], history: [[]], historyIndex: 0 },
      ];
    }

    const defaultPages = createDefaultPages();
    const initialState = {
      pages: defaultPages,
      activePageId: defaultPages[0].id,
      components: [],
      selectedId: null,
      history: [[]],
      historyIndex: 0,
      previewMode: false,
      projectName: 'My Project',
      deviceMode: 'desktop',
    };

    function syncActivePage(state) {
      return {
        ...state,
        pages: state.pages.map(p =>
          p.id === state.activePageId
            ? { ...p, components: state.components, history: state.history, historyIndex: state.historyIndex }
            : p
        ),
      };
    }

    function pushHistory(state, components) {
      const newHistory = state.history.slice(0, state.historyIndex + 1);
      newHistory.push(JSON.parse(JSON.stringify(components)));
      const next = { ...state, history: newHistory.slice(-50), historyIndex: Math.min(newHistory.length - 1, 49), components };
      return syncActivePage(next);
    }

    function reducer(state, action) {
      switch (action.type) {
        case 'ADD_COMPONENT': {
          const newComp = action.payload;
          const newComponents = [...state.components, newComp];
          return pushHistory({ ...state, selectedId: newComp.id }, newComponents);
        }
        case 'UPDATE_COMPONENT': {
          const newComponents = state.components.map(c =>
            c.id === action.payload.id ? { ...c, ...action.payload.updates } : c
          );
          return pushHistory(state, newComponents);
        }
        case 'UPDATE_COMPONENT_FAST': {
          // No history push for drag moves
          const newComponents = state.components.map(c =>
            c.id === action.payload.id ? { ...c, ...action.payload.updates } : c
          );
          return syncActivePage({ ...state, components: newComponents });
        }
        case 'DELETE_COMPONENT': {
          const newComponents = state.components.filter(c => c.id !== action.payload);
          return pushHistory({ ...state, selectedId: null }, newComponents);
        }
        case 'SELECT_COMPONENT':
          return { ...state, selectedId: action.payload };
        case 'REORDER_COMPONENT': {
          const { fromIndex, toIndex } = action.payload;
          const arr = [...state.components];
          const [removed] = arr.splice(fromIndex, 1);
          arr.splice(toIndex, 0, removed);
          return pushHistory(state, arr);
        }
        case 'TOGGLE_VISIBILITY': {
          const newComponents = state.components.map(c =>
            c.id === action.payload ? { ...c, visible: !c.visible } : c
          );
          return syncActivePage({ ...state, components: newComponents });
        }
        // FEATURE 3: Lock/Unlock
        case 'TOGGLE_LOCK': {
          const newComponents = state.components.map(c =>
            c.id === action.payload ? { ...c, locked: !c.locked } : c
          );
          return syncActivePage({ ...state, components: newComponents });
        }
        // FEATURE 3: Rename layer
        case 'RENAME_COMPONENT': {
          const newComponents = state.components.map(c =>
            c.id === action.payload.id ? { ...c, label: action.payload.label } : c
          );
          return pushHistory(state, newComponents);
        }
        case 'UNDO': {
          if (state.historyIndex <= 0) return state;
          const newIndex = state.historyIndex - 1;
          return syncActivePage({ ...state, historyIndex: newIndex, components: JSON.parse(JSON.stringify(state.history[newIndex])), selectedId: null });
        }
        case 'REDO': {
          if (state.historyIndex >= state.history.length - 1) return state;
          const newIndex = state.historyIndex + 1;
          return syncActivePage({ ...state, historyIndex: newIndex, components: JSON.parse(JSON.stringify(state.history[newIndex])), selectedId: null });
        }
        case 'CLEAR_CANVAS':
          return pushHistory({ ...state, selectedId: null }, []);
        case 'SET_PREVIEW':
          return { ...state, previewMode: action.payload };
        case 'SET_DEVICE':
          return { ...state, deviceMode: action.payload };
        case 'SET_PROJECT_NAME':
          return { ...state, projectName: action.payload };
        // FEATURE 4: Duplicate
        case 'DUPLICATE_COMPONENT': {
          const comp = state.components.find(c => c.id === action.payload);
          if (!comp) return state;
          const dup = { ...JSON.parse(JSON.stringify(comp)), id: genId(), x: comp.x + 24, y: comp.y + 24, label: comp.label + ' Copy', locked: false };
          const newComponents = [...state.components, dup];
          return pushHistory({ ...state, selectedId: dup.id }, newComponents);
        }
        case 'LOAD_PROJECT': {
          return syncActivePage({ ...state, components: action.payload, history: [JSON.parse(JSON.stringify(action.payload))], historyIndex: 0, selectedId: null });
        }

        // =========================================================
        // MULTI-PAGE ACTIONS
        // =========================================================
        case 'SWITCH_PAGE': {
          const targetId = action.payload;
          if (targetId === state.activePageId) return state;
          const synced = syncActivePage(state);
          const target = synced.pages.find(p => p.id === targetId);
          if (!target) return synced;
          return {
            ...synced,
            activePageId: target.id,
            components: target.components || [],
            history: target.history && target.history.length ? target.history : [target.components || []],
            historyIndex: typeof target.historyIndex === 'number' ? target.historyIndex : 0,
            selectedId: null,
          };
        }
        case 'ADD_PAGE': {
          const synced = syncActivePage(state);
          const existingNames = new Set(synced.pages.map(p => p.name.toLowerCase()));
          const existingSlugs = new Set(synced.pages.map(p => (p.slug || '').toLowerCase()));
          let baseName = (action.payload?.name || 'New Page').trim();
          let finalName = baseName;
          let idx = 2;
          while (existingNames.has(finalName.toLowerCase())) {
            finalName = `${baseName} ${idx++}`;
          }
          let baseSlug = slugifyPage(action.payload?.slug || finalName);
          let finalSlug = baseSlug;
          let sIdx = 2;
          while (existingSlugs.has(finalSlug.toLowerCase())) {
            finalSlug = `${baseSlug}-${sIdx++}`;
          }
          const newPage = {
            id: genPageId(),
            name: finalName,
            slug: finalSlug,
            isHome: false,
            components: [],
            history: [[]],
            historyIndex: 0,
          };
          return {
            ...synced,
            pages: [...synced.pages, newPage],
            activePageId: newPage.id,
            components: [],
            history: [[]],
            historyIndex: 0,
            selectedId: null,
          };
        }
        case 'RENAME_PAGE': {
          const { id, name } = action.payload;
          const trimmed = (name || '').trim();
          if (!trimmed) return state;
          return {
            ...state,
            pages: state.pages.map(p => p.id === id ? { ...p, name: trimmed, slug: slugifyPage(trimmed) } : p),
          };
        }
        case 'DELETE_PAGE': {
          if (state.pages.length <= 1) return state;
          const synced = syncActivePage(state);
          const remaining = synced.pages.filter(p => p.id !== action.payload);
          if (!remaining.some(p => p.isHome)) {
            remaining[0] = { ...remaining[0], isHome: true };
          }
          let nextActive = remaining.find(p => p.id === synced.activePageId);
          if (!nextActive) {
            nextActive = remaining.find(p => p.isHome) || remaining[0];
          }
          return {
            ...synced,
            pages: remaining,
            activePageId: nextActive.id,
            components: nextActive.components || [],
            history: nextActive.history && nextActive.history.length ? nextActive.history : [nextActive.components || []],
            historyIndex: typeof nextActive.historyIndex === 'number' ? nextActive.historyIndex : 0,
            selectedId: null,
          };
        }
        case 'DUPLICATE_PAGE': {
          const synced = syncActivePage(state);
          const srcIdx = synced.pages.findIndex(p => p.id === action.payload);
          if (srcIdx === -1) return synced;
          const src = synced.pages[srcIdx];
          const existingNames = new Set(synced.pages.map(p => p.name.toLowerCase()));
          let copyName = `${src.name} Copy`;
          let idx = 2;
          while (existingNames.has(copyName.toLowerCase())) {
            copyName = `${src.name} Copy ${idx++}`;
          }
          const clonedComps = JSON.parse(JSON.stringify(src.components || [])).map(c => ({ ...c, id: genId() }));
          const newPage = {
            id: genPageId(),
            name: copyName,
            slug: slugifyPage(copyName),
            isHome: false,
            components: clonedComps,
            history: [JSON.parse(JSON.stringify(clonedComps))],
            historyIndex: 0,
          };
          const nextPages = [...synced.pages];
          nextPages.splice(srcIdx + 1, 0, newPage);
          return {
            ...synced,
            pages: nextPages,
            activePageId: newPage.id,
            components: clonedComps,
            history: newPage.history,
            historyIndex: 0,
            selectedId: null,
          };
        }
        case 'SET_HOME_PAGE': {
          return {
            ...state,
            pages: state.pages.map(p => ({ ...p, isHome: p.id === action.payload })),
          };
        }
        case 'REORDER_PAGES': {
          const { fromIndex, toIndex } = action.payload;
          const arr = [...state.pages];
          const [removed] = arr.splice(fromIndex, 1);
          arr.splice(toIndex, 0, removed);
          return { ...state, pages: arr };
        }
        case 'LOAD_MULTI_PAGE_PROJECT': {
          const { pages, activePageId, projectName } = action.payload;
          const safePages = (pages && pages.length ? pages : createDefaultPages()).map((p, idx) => {
            const comps = (p.components || []).map(c => ({ locked: false, ...c }));
            return {
              ...p,
              slug: p.slug || slugifyPage(p.name),
              isHome: typeof p.isHome === 'boolean' ? p.isHome : idx === 0,
              components: comps,
              history: [JSON.parse(JSON.stringify(comps))],
              historyIndex: 0,
            };
          });
          if (!safePages.some(p => p.isHome)) safePages[0].isHome = true;
          const target = safePages.find(p => p.id === activePageId) || safePages.find(p => p.isHome) || safePages[0];
          return {
            ...state,
            pages: safePages,
            activePageId: target.id,
            components: target.components,
            history: target.history,
            historyIndex: 0,
            selectedId: null,
            projectName: projectName || state.projectName,
          };
        }
        default:
          return state;
      }
    }

    const CUSTOM_TPL_INDEX_KEY = 'vds_custom_templates_index';
    const CUSTOM_TPL_PREFIX = 'vds_tpl_';
    const CUSTOM_TPL_IMG_PREFIX = 'vds_tpl_img_';

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(36) + '_' + str.length;
    }

    // Lightweight IndexedDB helper used automatically when localStorage quota is exceeded
    const TemplateIDB = {
      _dbPromise: null,
      open() {
        if (this._dbPromise) return this._dbPromise;
        this._dbPromise = new Promise((resolve, reject) => {
          if (typeof indexedDB === 'undefined') return reject(new Error('IndexedDB unavailable'));
          const req = indexedDB.open('vds_templates_db', 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('templates')) db.createObjectStore('templates');
            if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
        });
        return this._dbPromise;
      },
      async put(storeName, key, val) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).put(val, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },
      async get(storeName, key) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async del(storeName, key) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).delete(key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },
      async getAllKeys(storeName) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).getAllKeys();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      },
    };

    const TemplateStorage = {
      getIndex() {
        try {
          const raw = localStorage.getItem(CUSTOM_TPL_INDEX_KEY);
          const list = raw ? JSON.parse(raw) : [];
          return Array.isArray(list) ? list : [];
        } catch {
          return [];
        }
      },

      saveIndex(list) {
        localStorage.setItem(CUSTOM_TPL_INDEX_KEY, JSON.stringify(list));
      },

      // Deduplicate data-URI images across templates to save storage space
      async _extractImages(components) {
        const cloned = JSON.parse(JSON.stringify(components));
        for (const comp of cloned) {
          const src = comp?.props?.src;
          if (typeof src === 'string' && src.startsWith('data:image/') && src.length > 512) {
            const imgId = hashString(src);
            const lsKey = CUSTOM_TPL_IMG_PREFIX + imgId;
            let stored = false;
            if (localStorage.getItem(lsKey) !== null) {
              stored = true;
            } else {
              try {
                localStorage.setItem(lsKey, src);
                stored = true;
              } catch {
                // Quota exceeded in localStorage — store image in IndexedDB
                await TemplateIDB.put('images', imgId, src);
                stored = true;
              }
            }
            if (stored) {
              comp.props.src = 'imgref:' + imgId;
            }
          }
        }
        return cloned;
      },

      async _restoreImages(components) {
        const cloned = JSON.parse(JSON.stringify(components));
        for (const comp of cloned) {
          const src = comp?.props?.src;
          if (typeof src === 'string' && src.startsWith('imgref:')) {
            const imgId = src.slice(7);
            let data = null;
            try {
              data = localStorage.getItem(CUSTOM_TPL_IMG_PREFIX + imgId);
            } catch {}
            if (!data) {
              try {
                data = await TemplateIDB.get('images', imgId);
              } catch {}
            }
            comp.props.src = data || '';
          }
        }
        return cloned;
      },

      async _cleanupUnusedImages(remainingIndex) {
        const usedIds = new Set();
        for (const meta of remainingIndex) {
          try {
            const full = await this.loadTemplateRaw(meta.id);
            if (full && Array.isArray(full.components)) {
              for (const c of full.components) {
                const src = c?.props?.src;
                if (typeof src === 'string' && src.startsWith('imgref:')) {
                  usedIds.add(src.slice(7));
                }
              }
            }
          } catch {}
        }
        // Clean localStorage image keys
        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith(CUSTOM_TPL_IMG_PREFIX)) {
              const id = k.slice(CUSTOM_TPL_IMG_PREFIX.length);
              if (!usedIds.has(id)) localStorage.removeItem(k);
            }
          }
        } catch {}
        // Clean IndexedDB image keys
        try {
          const keys = await TemplateIDB.getAllKeys('images');
          for (const id of keys) {
            if (!usedIds.has(id)) await TemplateIDB.del('images', id);
          }
        } catch {}
      },

      async saveTemplate({ name, description, components, pages, activePageId, theme, projectName, deviceMode, thumbnail }) {
        const id = 'ctpl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const createdAt = new Date().toISOString();
        const dedupedComponents = await this._extractImages(components);
        let dedupedPages = undefined;
        if (Array.isArray(pages) && pages.length > 0) {
          dedupedPages = [];
          for (const pg of pages) {
            dedupedPages.push({
              ...pg,
              history: undefined,
              historyIndex: undefined,
              components: await this._extractImages(pg.components || []),
            });
          }
        }

        const payload = {
          id,
          name: name.trim(),
          description: (description || '').trim(),
          createdAt,
          projectName: projectName || name.trim(),
          deviceMode: deviceMode || 'desktop',
          theme: JSON.parse(JSON.stringify(theme)),
          components: dedupedComponents,
          pages: dedupedPages,
          activePageId: activePageId || undefined,
          thumbnail: thumbnail || '',
        };

        let storageType = 'ls';
        try {
          localStorage.setItem(CUSTOM_TPL_PREFIX + id, JSON.stringify(payload));
        } catch {
          // localStorage full — fall back to IndexedDB
          storageType = 'idb';
          await TemplateIDB.put('templates', id, payload);
        }

        const meta = {
          id,
          name: payload.name,
          description: payload.description,
          createdAt,
          thumbnail: payload.thumbnail,
          componentCount: dedupedComponents.length,
          storageType,
        };

        const index = this.getIndex();
        index.unshift(meta);
        try {
          this.saveIndex(index);
        } catch {
          // If thumbnail made index too big for localStorage, move thumbnail to payload only
          meta.thumbnail = '';
          this.saveIndex(index);
        }
        return meta;
      },

      async loadTemplateRaw(id) {
        try {
          const raw = localStorage.getItem(CUSTOM_TPL_PREFIX + id);
          if (raw) return JSON.parse(raw);
        } catch {}
        try {
          const idbVal = await TemplateIDB.get('templates', id);
          if (idbVal) return idbVal;
        } catch {}
        return null;
      },

      async loadTemplate(id) {
        const raw = await this.loadTemplateRaw(id);
        if (!raw) throw new Error('Template data not found.');
        const components = await this._restoreImages(raw.components || []);
        let pages = raw.pages;
        if (Array.isArray(raw.pages) && raw.pages.length > 0) {
          pages = [];
          for (const pg of raw.pages) {
            pages.push({
              ...pg,
              components: await this._restoreImages(pg.components || []),
            });
          }
        }
        return { ...raw, components, pages };
      },

      async renameTemplate(id, newName) {
        const trimmed = newName.trim();
        const index = this.getIndex().map(m => m.id === id ? { ...m, name: trimmed } : m);
        this.saveIndex(index);
        const raw = await this.loadTemplateRaw(id);
        if (raw) {
          raw.name = trimmed;
          try {
            if (localStorage.getItem(CUSTOM_TPL_PREFIX + id) !== null) {
              localStorage.setItem(CUSTOM_TPL_PREFIX + id, JSON.stringify(raw));
            } else {
              await TemplateIDB.put('templates', id, raw);
            }
          } catch {
            await TemplateIDB.put('templates', id, raw);
          }
        }
        return index;
      },

      async duplicateTemplate(id) {
        const raw = await this.loadTemplateRaw(id);
        if (!raw) throw new Error('Original template not found.');
        const index = this.getIndex();
        const existingNames = new Set(index.map(m => m.name.toLowerCase()));
        let baseName = raw.name + ' (Copy)';
        let copyName = baseName;
        let counter = 2;
        while (existingNames.has(copyName.toLowerCase())) {
          copyName = `${raw.name} (Copy ${counter++})`;
        }

        const newId = 'ctpl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const createdAt = new Date().toISOString();
        const newPayload = {
          ...JSON.parse(JSON.stringify(raw)),
          id: newId,
          name: copyName,
          createdAt,
        };

        let storageType = 'ls';
        try {
          localStorage.setItem(CUSTOM_TPL_PREFIX + newId, JSON.stringify(newPayload));
        } catch {
          storageType = 'idb';
          await TemplateIDB.put('templates', newId, newPayload);
        }

        const meta = {
          id: newId,
          name: copyName,
          description: newPayload.description || '',
          createdAt,
          thumbnail: newPayload.thumbnail || '',
          componentCount: (newPayload.components || []).length,
          storageType,
        };
        index.unshift(meta);
        this.saveIndex(index);
        return index;
      },

      async deleteTemplate(id) {
        const index = this.getIndex().filter(m => m.id !== id);
        this.saveIndex(index);
        try { localStorage.removeItem(CUSTOM_TPL_PREFIX + id); } catch {}
        try { await TemplateIDB.del('templates', id); } catch {}
        await this._cleanupUnusedImages(index);
        return index;
      },
    };

    // Generate a lightweight miniature PNG thumbnail from canvas components
    function generateTemplateThumbnail(components, theme, deviceMode) {
      try {
        const device = DEVICE_PRESETS[deviceMode] || DEVICE_PRESETS.desktop;
        const srcW = device.width || 1280;
        const srcH = Math.max(device.minHeight || 800, ...components.map(c => (c.y || 0) + (typeof c.height === 'number' ? c.height : 120)));
        const thumbW = 320;
        const thumbH = 180;
        const scale = Math.min(thumbW / srcW, thumbH / Math.min(srcH, 960));

        const canvas = document.createElement('canvas');
        canvas.width = thumbW;
        canvas.height = thumbH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, thumbW, thumbH);

        const sorted = [...components].filter(c => c.visible !== false).sort((a, b) => (a.zIndex || 1) - (b.zIndex || 1));
        for (const c of sorted) {
          const x = (c.x || 0) * scale;
          const y = (c.y || 0) * scale;
          const w = (c.width === 'auto' ? 140 : (c.width || 180)) * scale;
          const h = (c.height === 'auto' ? 36 : (c.height || 60)) * scale;
          if (y > thumbH) continue;

          ctx.save();
          ctx.globalAlpha = c.style?.opacity ?? 1;
          const p = c.props || {};
          const s = c.style || {};

          if (c.type === 'section' || c.type === 'container') {
            ctx.fillStyle = s.backgroundColor || p.bgColor || '#f1f5f9';
            ctx.fillRect(x, y, w, h);
          } else if (c.type === 'card') {
            ctx.fillStyle = p.bgColor || theme?.bgColor || '#ffffff';
            ctx.fillRect(x, y, w, Math.max(h, 24));
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, w, Math.max(h, 24));
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(x + 4, y + 5, Math.min(w - 8, 40), 4);
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(x + 4, y + 12, Math.min(w - 8, 56), 3);
          } else if (c.type === 'button') {
            ctx.fillStyle = p.bgColor || theme?.primaryColor || '#3b82f6';
            ctx.fillRect(x, y, Math.max(w, 26), Math.max(h * 0.4, 9));
          } else if (c.type === 'heading' || c.type === 'paragraph' || c.type === 'text') {
            ctx.fillStyle = p.color || theme?.textColor || '#1e293b';
            const barH = c.type === 'heading' ? Math.max(4, (p.fontSize || 24) * scale * 0.8) : 3;
            ctx.fillRect(x, y + 2, Math.min(w, thumbW - x), barH);
            if (c.type === 'paragraph') {
              ctx.globalAlpha = 0.5;
              ctx.fillRect(x, y + 8, Math.min(w * 0.75, thumbW - x), 2.5);
            }
          } else if (c.type === 'image') {
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(x, y, w, h);
          } else if (c.type === 'divider') {
            ctx.fillStyle = p.color || '#e5e7eb';
            ctx.fillRect(x, y, w, 1);
          } else if (c.type === 'input') {
            ctx.strokeStyle = p.borderColor || '#cbd5e1';
            ctx.strokeRect(x, y, w, Math.max(h * 0.5, 10));
          }
          ctx.restore();
        }
        return canvas.toDataURL('image/png', 0.8);
      } catch {
        return '';
      }
    }

    // =========================================================
    // SAVE AS TEMPLATE MODAL
    // =========================================================
    function SaveTemplateModal({ existingNames, components, theme, projectName, deviceMode, onSave, onCancel }) {
      const suggestUniqueName = (base) => {
        const clean = (base || 'My Template').trim();
        const lowerSet = new Set(existingNames.map(n => n.toLowerCase()));
        if (!lowerSet.has(clean.toLowerCase())) return clean;
        let i = 2;
        while (lowerSet.has(`${clean} (${i})`.toLowerCase())) i++;
        return `${clean} (${i})`;
      };

      const [name, setName] = useState(() => suggestUniqueName(projectName));
      const [description, setDescription] = useState('');
      const [error, setError] = useState('');
      const [saving, setSaving] = useState(false);

      const thumbnail = useMemo(
        () => generateTemplateThumbnail(components, theme, deviceMode),
        [components, theme, deviceMode]
      );

      const isDuplicate = existingNames.some(n => n.toLowerCase() === name.trim().toLowerCase());

      const handleSubmit = async (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        if (!trimmed) {
          setError('Please enter a template name.');
          return;
        }
        if (isDuplicate) {
          setError(`A template named "${trimmed}" already exists. Please choose a different name.`);
          return;
        }
        setSaving(true);
        setError('');
        try {
          await onSave({ name: trimmed, description, thumbnail });
        } catch (err) {
          setError(err?.message || 'Failed to save template. Storage may be full.');
          setSaving(false);
        }
      };

      return (
        <div className="modal-overlay" style={{ zIndex: 10050 }} onClick={onCancel}>
          <div className="modal-box" style={{ width: '90vw', maxWidth: 460 }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <span style={{ fontSize: 18 }}>💾</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: '#f9fafb' }}>Save as Template</div>
                <div style={{ fontSize: 12, color: '#9ca3af', marginTop: 2 }}>
                  Save your current layout, components, images &amp; theme as a reusable template.
                </div>
              </div>
              <button className="modal-close" onClick={onCancel} title="Cancel">
                <Icon name="X" size={18} />
              </button>
            </div>
            <form onSubmit={handleSubmit} style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 14 }}>
              {thumbnail && (
                <div>
                  <div style={{ fontSize: 11, fontWeight: 600, color: '#9ca3af', marginBottom: 6 }}>PREVIEW THUMBNAIL</div>
                  <div style={{ border: '1px solid #374151', borderRadius: 8, overflow: 'hidden', background: '#fff', height: 130, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <img src={thumbnail} alt="Template preview" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                  </div>
                </div>
              )}
              <div>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 600, color: '#d1d5db', marginBottom: 6 }}>
                  Template Name *
                </label>
                <input
                  type="text"
                  value={name}
                  onChange={e => { setName(e.target.value); setError(''); }}
                  placeholder="e.g. Agency Landing Page"
                  autoFocus
                  style={{
                    width: '100%',
                    padding: '8px 10px',
                    background: '#111827',
                    border: `1px solid ${isDuplicate || error ? '#ef4444' : '#374151'}`,
                    borderRadius: 6,
                    color: '#f9fafb',
                    fontSize: 13,
                    outline: 'none',
                    boxSizing: 'border-box',
                  }}
                />
                {isDuplicate && !error && (
                  <div style={{ fontSize: 11, color: '#f59e0b', marginTop: 4 }}>
                    A template with this name already exists. Choose a unique name to avoid overwriting.
                  </div>
                )}
              </div>
              <div>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 600, color: '#d1d5db', marginBottom: 6 }}>
                  Description <span style={{ color: '#6b7280', fontWeight: 400 }}>(optional)</span>
                </label>
                <textarea
                  value={description}
                  onChange={e => setDescription(e.target.value)}
                  placeholder="Describe this template..."
                  rows={3}
                  style={{
                    width: '100%',
                    padding: '8px 10px',
                    background: '#111827',
                    border: '1px solid #374151',
                    borderRadius: 6,
                    color: '#f9fafb',
                    fontSize: 13,
                    outline: 'none',
                    resize: 'vertical',
                    boxSizing: 'border-box',
                  }}
                />
              </div>
              {error && (
                <div style={{ fontSize: 12, color: '#fca5a5', background: 'rgba(239,68,68,0.12)', border: '1px solid rgba(239,68,68,0.4)', borderRadius: 6, padding: '8px 10px' }}>
                  {error}
                </div>
              )}
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 4 }}>
                <button
                  type="button"
                  onClick={onCancel}
                  style={{
                    padding: '8px 14px',
                    background: '#374151',
                    color: '#e5e7eb',
                    border: 'none',

                    fontSize: 12,
                    fontWeight: 600,
                    cursor: 'pointer',
                  }}

                  Cancel

                <button
                  type="submit"
                  disabled={saving || !name.trim() || isDuplicate}
                  className="save-tpl-btn"
                >
                  {saving ? 'Saving...' : 'Save Template'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function TemplateGallery({ onClose, theme, setTheme }) {
      const { state, dispatch } = useStudio();
      const [hovered, setHovered] = useState(null);
      const [activeTab, setActiveTab] = useState('all'); // 'all' | 'builtin' | 'custom'
      const [showSaveModal, setShowSaveModal] = useState(false);
      const [customTemplates, setCustomTemplates] = useState(() => TemplateStorage.getIndex());
      const [renamingId, setRenamingId] = useState(null);
      const [renameValue, setRenameValue] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [statusMsg, setStatusMsg] = useState('');

      const flashStatus = (msg) => {
        setStatusMsg(msg);
        setTimeout(() => setStatusMsg(''), 3000);
      };

      const handleUseBuiltinTemplate = (tplId) => {
        if (state.components.length > 0) {
          if (!confirm('This will replace your current canvas. Continue?')) return;
        }
        const components = buildTemplateComponents(tplId, theme);
        dispatch({ type: 'LOAD_PROJECT', payload: components });
        const tpl = TEMPLATES.find(t => t.id === tplId);
        if (tpl) dispatch({ type: 'SET_PROJECT_NAME', payload: tpl.name + ' Template' });
        onClose();
      };

      const handleUseCustomTemplate = async (meta) => {
        if (state.components.length > 0) {
          if (!confirm(`Load "${meta.name}"? This will replace your current canvas.`)) return;
        }
        try {
          const full = await TemplateStorage.loadTemplate(meta.id);
          if (full.theme && setTheme) {
            setTheme({ ...DEFAULT_THEME, ...JSON.parse(JSON.stringify(full.theme)) });
          }
          if (Array.isArray(full.pages) && full.pages.length > 0) {
            dispatch({
              type: 'LOAD_MULTI_PAGE_PROJECT',
              payload: { pages: full.pages, activePageId: full.activePageId, projectName: full.projectName || full.name },
            });
          } else {
            // Deep clone & assign fresh IDs so editing the canvas never affects the saved template
            const restoredComponents = (full.components || []).map(c => ({
              ...JSON.parse(JSON.stringify(c)),
              id: genId(),
            }));
            dispatch({ type: 'LOAD_PROJECT', payload: restoredComponents });
            dispatch({ type: 'SET_PROJECT_NAME', payload: full.projectName || full.name });
          }
          if (full.deviceMode) {
            dispatch({ type: 'SET_DEVICE', payload: full.deviceMode });
          }
          onClose();
        } catch (err) {
          alert('Could not load template: ' + (err?.message || 'Unknown error'));
        }
      };

      const handleSaveNewTemplate = async ({ name, description, thumbnail }) => {
        const syncedPages = (state.pages || []).map(p =>
          p.id === state.activePageId ? { ...p, components: state.components } : p
        );
        await TemplateStorage.saveTemplate({
          name,
          description,
          thumbnail,
          components: state.components,
          pages: syncedPages,
          activePageId: state.activePageId,
          theme,
          projectName: state.projectName,
          deviceMode: state.deviceMode,
        });
        setCustomTemplates(TemplateStorage.getIndex());
        setShowSaveModal(false);
        setActiveTab('all');
        flashStatus(`Saved "${name}" to My Templates`);
      };

      const handleStartRename = (meta) => {
        setRenamingId(meta.id);
        setRenameValue(meta.name);
        setConfirmDeleteId(null);
      };

      const handleConfirmRename = async (id) => {
        const trimmed = renameValue.trim();
        if (!trimmed) return;
        const dup = customTemplates.some(m => m.id !== id && m.name.toLowerCase() === trimmed.toLowerCase());
        if (dup) {
          alert(`A template named "${trimmed}" already exists. Please choose another name.`);
          return;
        }
        const updated = await TemplateStorage.renameTemplate(id, trimmed);
        setCustomTemplates(updated);
        setRenamingId(null);
        flashStatus('Template renamed');
      };

      const handleDuplicateCustom = async (id) => {
        try {
          const updated = await TemplateStorage.duplicateTemplate(id);
          setCustomTemplates(updated);
          flashStatus('Template duplicated');
        } catch (err) {
          alert('Could not duplicate template: ' + (err?.message || 'Storage error'));
        }
      };

      const handleDeleteCustom = async (id) => {
        const updated = await TemplateStorage.deleteTemplate(id);
        setCustomTemplates(updated);
        setConfirmDeleteId(null);
        flashStatus('Template deleted');

        try {

        } catch {
          return '';
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" style={{ width: '92vw', maxWidth: 960, maxHeight: '90vh' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <span style={{ fontSize: 18 }}>🗂️</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: '#f9fafb' }}>Template Gallery</div>
                <div style={{ fontSize: 12, color: '#6b7280', marginTop: 2 }}>Choose a built-in or custom template, or save your current design.</div>
              </div>
              {statusMsg && (
                <span style={{ fontSize: 12, color: '#34d399', fontWeight: 600, marginRight: 8 }}>✓ {statusMsg}</span>
              )}

                className="save-tpl-btn"
                disabled={state.components.length === 0}

                onClick={() => setShowSaveModal(true)}
              >
                <Icon name="Plus" size={14} />
                <span>Save as Template</span>
